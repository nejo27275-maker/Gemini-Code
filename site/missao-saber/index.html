/* ---------- Resumo da semana (aparece na primeira visita da semana nova) ---------- */
function resumoSemana(sem, meu, pos) {
  const p = P(), [y, mo, d] = sem.split('-').map(Number), ini = new Date(y, mo - 1, d);
  let dias = 0, melhor = 0, melhorDia = null, licoes = 0, ac = 0, er = 0;
  for (let i = 0; i < 7; i++) {
    const x = new Date(ini); x.setDate(ini.getDate() + i);
    const k = diaStr(x), v = p.xpDia[k] || 0, h = (p.hist || {})[k] || {};
    if (v) dias++; if (v > melhor) { melhor = v; melhorDia = x; }
    licoes += h.licoes || 0; ac += h.acertos || 0; er += h.erros || 0;
  }
  const fim = new Date(ini); fim.setDate(ini.getDate() + 6);
  const frase = dias >= 6 ? 'Semana de campeão! 🏆' : dias >= 4 ? 'Muito bem! Constância é tudo 💪' : dias >= 2 ? 'Bom começo! Que tal estudar mais dias nesta semana? 🚀' : 'Essa semana vai ser melhor: um pouquinho todo dia já faz diferença! 🌱';
  comemora(f => janela('<div class="big">📅</div><h2 class="orb">SUA SEMANA</h2><p class="mut">' + dm(ini) + ' a ' + dm(fim) + '</p>' +
    '<div class="semres"><div><b>' + meu + '</b><small>XP</small></div><div><b>' + dias + '/7</b><small>dias de estudo</small></div>' +
    (licoes ? '<div><b>' + licoes + '</b><small>lições</small></div>' : '') + (ac + er ? '<div><b>' + Math.round(ac / (ac + er) * 100) + '%</b><small>de acerto</small></div>' : '') +
    '<div><b>' + pos + 'º</b><small>na liga</small></div></div>' +
    (melhorDia ? '<p>⭐ Melhor dia: <b>' + SEMANA[melhorDia.getDay()] + '</b>, com ' + melhor + ' XP.</p>' : '') + '<p style="font-weight:800">' + frase + '</p>',
    [{t: 'BORA PRA MAIS UMA! 🚀', cor: 'var(--gold)'}], f));
}

/* ---------- ABA LIGA (ranking da semana) ---------- */
function hash01(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
const BOTS = [{nome: 'Robô Turbo', av: '🤖', taxa: 45}, {nome: 'Robô Nerd', av: '🤓', taxa: 70}, {nome: 'Robô Ninja', av: '🥷', taxa: 32}, {nome: 'Robô Preguiça', av: '🦥', taxa: 14}];
function xpBot(b, sem, completa) {
  const [y, mo, d] = sem.split('-').map(Number), dias = completa ? 7 : Math.max(0, Math.min(7, (Date.now() - new Date(y, mo - 1, d)) / DIA));
  return Math.round(b.taxa * dias * (.75 + .5 * hash01(b.nome + sem)));
}
function premioLiga() {
  const p = P(), sem = semanaStr();
  if (!p.ligaSem) { p.ligaSem = sem; salvar(); return; }
  if (p.ligaSem === sem) return;
  const ant = p.ligaSem; p.ligaSem = sem; salvar();
  const meu = p.xpSem[ant] || 0; if (!meu) return;
  const outros = Object.entries(DB.players).filter(([id]) => id !== DB.current).map(([, x]) => (x.xpSem && x.xpSem[ant]) || 0).concat(BOTS.map(b => xpBot(b, ant, true)));
  const pos = 1 + outros.filter(x => x > meu).length;
  resumoSemana(ant, meu, pos);
  if (pos <= 3) { const g = [30, 20, 10][pos - 1];
    comemora(fim => { ganhaGemas(g, 'liga'); confete(200); SFX.win();
      janela('<div class="big">' + ['🥇', '🥈', '🥉'][pos - 1] + '</div><h2 class="orb">PÓDIO NA LIGA!</h2><p>Na semana passada você ficou em <b>' + pos + 'º lugar</b> com ' + meu + ' XP. Prêmio: <b>+' + g + ' 💎</b>!</p>', [{t: 'UHUL! 🎉'}], fim); }); }

    '<button class="btn w" id="pShare" style="margin-top:10px">📤 Copiar meu progresso para mandar à turma</button>' +
    '<div class="sec-t">🏅 Conquistas • ' + nConq + '/' + CONQ.length + '</div><div class="badges">' +
    CONQ.map(c => '<div class="bdg' + (p.badges[c.id] ? ' on' : '') + '"><i>' + c.e + '</i><b>' + esc(c.n) + '</b>' + esc(c.d) + '</div>').join('') + '</div>' +
    '<div class="sec-t">' + APP.botEm + ' Sobre o ' + APP.bot + ' e a IA</div><div class="card" style="font-size:14px;line-height:1.55;color:#cdd3ff">' +
    '<b>Status:</b> ' + statusIA() + '<br><br>Quando o app é aberto pelo <b>link do claude.ai</b>, o ' + APP.bot + ' usa a IA <b>Claude</b> para conversar, dar dicas, explicar erros, montar o plano do dia e criar lições novas. ' +
    'A IA usa a conta do Claude de quem está jogando, e o navegador pede permissão na primeira vez.<br><br>No arquivo baixado (fora do claude.ai), o ' + APP.bot + ' funciona no <b>modo offline</b>: procura as respostas no conteúdo do app e o treinador automático escolhe as tarefas.</div>' +
    '<p class="foot">' + APP.fonte + '<br>Seu progresso fica salvo neste aparelho' + (NUVEM && NUVEM.db ? ' e na nuvem da sua conta' : '') + '.</p></div>';
  $('#pTroca').onclick = () => telaPerfil(true);
  ligaEstilo(); ligaMolduras(); ligaFotoPerfil(); ligaConta(); ligaAtalhos();
  if ($('#pInstala')) $('#pInstala').onclick = () => { SFX.tap(); instalarApp(); };
  $('#tCalmo').onclick = () => { DB.calmo = !DB.calmo; salvar(); aplicaTema(); $('#tCalmo').classList.toggle('on', DB.calmo); SFX.tap(); };
  $('#pShare').onclick = () => compartilhar();
  $('#tGr').onclick = () => { DB.grande = !DB.grande; salvar(); aplicaTema(); $('#tGr').classList.toggle('on', DB.grande); SFX.tap(); };
  $$('[data-meta]').forEach(b => b.onclick = () => { SFX.tap(); P().meta = +b.dataset.meta; salvar(); abaPerfil(); toast('🎯 Meta: ' + b.dataset.meta + ' XP por dia'); });
  $('#lVida').onclick = () => { const p = P(); if (p.gems < 30) return; p.gems -= 30; p.hearts = MAXV; p.hTs = Date.now(); salvar(); hud(); SFX.heart(); toast('❤️ Vidas recarregadas!'); abaPerfil(); };
  $('#lGelo').onclick = () => { const p = P(); if (p.gems < 50 || p.freeze >= 2) return; p.gems -= 50; p.freeze++; salvar(); hud(); SFX.gem(); toast('🧊 Protetor comprado!'); abaPerfil(); };
  $('#tSom').onclick = () => { DB.sound = !DB.sound; salvar(); $('#tSom').classList.toggle('on', DB.sound); SFX.tap(); };
  if ($('#tNar')) $('#tNar').onclick = () => { DB.narrador = !DB.narrador; salvar(); $('#tNar').classList.toggle('on', DB.narrador); if (DB.narrador) falar('Narrador ligado! Eu vou ler os cards e as perguntas pra você.'); else calar(); };
}

/* ---------- Jogadores ---------- */
function telaPerfil(podeFechar) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const lista = Object.entries(DB.players).sort((a, b) => b[1].xp - a[1].xp);
  let av = sorteia(AVATARES);
  ov.innerHTML = '<div class="modal"><div class="mascote">' + APP.botEm + '</div><h2 class="orb">' + APP.nome.toUpperCase() + '</h2><p>' + APP.sub + '<br><small class="mut">Trilha de lições, vidas, liga e o ' + APP.bot + ', seu tutor com IA</small></p>' +
    (lista.length ? '<div class="sec-t" style="margin:16px 0 0">👥 Quem vai jogar?</div><div class="plist">' +
      lista.map(([id, x]) => '<button data-id="' + id + '">' + avHTML(x, 'mini') + '<span>' + esc(x.nome) + '</span><small>Nv ' + nivel(x.xp).n + ' • ' + x.xp + ' XP</small></button>').join('') + '</div>' : '') +
    '<div class="sec-t" style="margin:16px 0 0">' + (lista.length ? '➕ Novo jogador' : 'Crie seu jogador') + '</div>' +
    '<input id="inNome" maxlength="16" placeholder="Seu nome ou apelido" autocomplete="off">' +
    '<div class="avs">' + AVATARES.map(a => '<button class="' + (a === av ? 'sel' : '') + '">' + a + '</button>').join('') + '</div>' +
    '<button class="btn go w" id="btnCriar">COMEÇAR ▶</button><button class="btn ghost w" id="btnRest" style="margin-top:8px">📥 Já tenho conta (restaurar)</button>' +
    '<p class="mut" id="nuvemPrim" style="font-size:12px;margin-top:8px"></p>' + (podeFechar ? '<button class="btn ghost w" id="btnFechar" style="margin-top:8px">Voltar</button>' : '') + '</div>';
  document.body.appendChild(ov);
  ov.querySelectorAll('.avs button').forEach(b => b.onclick = () => { ov.querySelectorAll('.avs button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); av = b.textContent; SFX.tap(); });
  ov.querySelectorAll('.plist button').forEach(b => b.onclick = () => { DB.current = b.dataset.id; norm(P()); salvar(); ov.remove(); aplicaTema(); premioLiga(); hud(); mostraAba('trilha', true); rodaFila(); });
  const criar = () => {
    const nome = $('#inNome').value.trim();
    if (!nome) { $('#inNome').focus(); $('#inNome').style.borderColor = 'var(--bad)'; SFX.no(); return; }
    novoJogador(nome, av); P().ligaSem = semanaStr(); DB.visto = 'v7'; salvar(); ov.remove(); aplicaTema(); hud(); mostraAba('trilha', true); SFX.win(); confete(90);
    comemora(fim => janela('<div class="mascote">' + APP.botEm + '</div><h2 class="orb">Oi, ' + esc(nome) + '!</h2><p style="text-align:left">Eu sou o <b>' + APP.bot + '</b>, seu tutor. Funciona assim:<br><br>' +
      '🗺️ Siga a <b>trilha</b>: cada lição libera a próxima.<br>❤️ Errar tira uma <b>vida</b> (elas voltam com o tempo).<br>🔁 O que você errar <b>volta</b> no fim da lição.<br>' +
      '🔥 Estude todo dia para manter a <b>ofensiva</b>.<br>' + APP.botEm + ' Eu monto seu <b>plano do dia</b> e te ajudo com dicas!</p>', [{t: 'BORA! 🚀'}], fim));
  };
  $('#btnCriar').onclick = criar;
  $('#btnRest').onclick = () => { SFX.tap(); restaurarConta(); }; nuvemUI();
  $('#inNome').onkeydown = e => { if (e.key === 'Enter') criar(); };
  if (podeFechar) $('#btnFechar').onclick = () => ov.remove();
  setTimeout(() => { const i = $('#inNome'); if (i) i.focus(); }, 50);
}

/* ---------- Barra do topo, abas e início ---------- */
let ABA = 'trilha', SUBTELA = false;
function hud() {
  const p = P(); if (!p) return; vidas(p);
  const Lv = nivel(p.xp);
  $('#hAv').innerHTML = avHTML(p, 'hd'); $('#hNome').textContent = p.nome + ' • Nv ' + Lv.n;
  $('#hBar').style.width = (Lv.resto / Lv.meta * 100) + '%';
  $('#hStreak').textContent = '🔥 ' + streakAtual(p); $('#hStreak').classList.toggle('off', p.lastDay !== diaStr());
  $('#hGem').textContent = '💎 ' + p.gems; $('#hHeart').textContent = '❤️ ' + p.hearts;
  const tb = $('#tabs [data-tab="treinar"]'), nErr = Object.keys(p.wrong).length;
  if (tb) { let d = tb.querySelector('.dot'); if (nErr && !d) { d = document.createElement('span'); d.className = 'dot'; tb.appendChild(d); } else if (!nErr && d) d.remove(); }
}
function mostraAba(nome, rolar) {
  if (nome) ABA = nome;
  SUBTELA = false; calar();
  if (SEGURA) { SEGURA = false; setTimeout(rodaFila, 300); }
  $$('#tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === ABA));
  if (ABA === 'trilha') abaTrilha(rolar !== false);
  else { ({treinar: abaTreinar, byte: abaByte, ranking: abaRanking, perfil: abaPerfil}[ABA] || abaTrilha)(); if (rolar !== false) scrollTo(0, 0); }
  hud();
}
function aoMudarIA() {
  if (!P() || L || FIM_ABERTO || SUBTELA || document.querySelector('.ov')) return;
  const y = scrollY; mostraAba(ABA, false); scrollTo(0, y);
}
$$('#tabs [data-tab]').forEach(b => b.onclick = () => { SFX.tap(); mostraAba(b.dataset.tab, true); });
$('#hMe').onclick = () => { SFX.tap(); mostraAba('perfil', true); };
$('#hHeart').onclick = () => { const p = P(); if (!p) return; vidas(p); toast(p.hearts >= MAXV ? '❤️ Vidas cheias!' : '❤️ ' + p.hearts + '/5 • próxima vida em ' + minutosProxVida() + ' min'); };
$('#hGem').onclick = () => { if (P()) toast('💎 ' + P().gems + ' cristais • gaste na loja do Perfil'); };
$('#hStreak').onclick = () => { const p = P(); if (p) toast(p.lastDay === diaStr() ? '🔥 Ofensiva garantida hoje!' : '🔥 Faça uma lição hoje para manter a ofensiva!'); };
$('#lX').onclick = sairLicao; $('#lCheck').onclick = verificar; $('#lHint').onclick = pedeDica;
setInterval(() => { const p = P(); if (!p) return; const h = p.hearts; vidas(p); if (p.hearts !== h) { salvar(); hud(); statusBar(); } }, 30000);
(function comecar() {
  if (DB.current && DB.players[DB.current]) { norm(P()); salvar(); aplicaTema(); premioLiga(); novidades(); hud(); mostraAba('trilha', true); setTimeout(checaConquistas, 900); setTimeout(rodaFila, 400); }
  else telaPerfil(false);
})();

</script>
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
