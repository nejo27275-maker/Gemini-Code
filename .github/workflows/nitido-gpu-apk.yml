name: Build Nitido GPU APK
on:
  push:
    branches: ["nitido-gpu-v2-27-build"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build release APK
        working-directory: nitido-gpu-v2
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nitido-gpu-v2.26-beta-apk
          path: nitido-gpu-v2/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
