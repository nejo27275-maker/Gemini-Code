name: Build Nitido GPU v2.26
on:
  push:
    branches: [nitido-gpu-v2-26-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare project
        run: |
          unzip -q nitido-gpu-v2_26-ci.zip
          cd nitido-gpu-v2
          rm -f app/nitido.keystore
          keytool -genkeypair -v \
            -keystore app/nitido.keystore \
            -storepass nitido123 \
            -keypass nitido123 \
            -alias nitido \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Nitido GPU, OU=Beta, O=Nitido, C=BR'
      - name: Ensure Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Run quick tests
        working-directory: nitido-gpu-v2
        run: |
          python3 tests/props.py
          bash tests/fps_boost_test.sh
          python3 tests/thermal_check.py
          python3 tests/a11y_fallback_check.py
          python3 tests/manifest_check.py
          python3 tests/shaders_check.py
      - name: Build release APK
        working-directory: nitido-gpu-v2
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp nitido-gpu-v2/app/build/outputs/apk/release/app-release.apk dist/nitido-gpu-v2.26.apk
          ls -lh dist/nitido-gpu-v2.26.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nitido-gpu-v2.26-apk
          path: dist/nitido-gpu-v2.26.apk
          if-no-files-found: error
          retention-days: 90
