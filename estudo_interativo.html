<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Estudo Gamer • AV2 Dezembro • 5º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a14; --bg2:#0e1324; --card:#121a33; --card2:#18213f; --line:#26305a;
  --txt:#e8ecff; --mut:#8e98c8; --cyan:#00e5ff; --pur:#a855f7; --pink:#ff2d95;
  --ok:#22ff88; --bad:#ff3b5c; --gold:#ffd23f; --acc:var(--cyan);
  --r:20px; --sh:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(60vw 60vw at 10% -10%,rgba(168,85,247,.22),transparent 60%),
             radial-gradient(50vw 50vw at 110% 20%,rgba(0,229,255,.16),transparent 60%),
             radial-gradient(60vw 50vw at 50% 120%,rgba(255,45,149,.14),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.hide{display:none!important}
.orb{font-family:Orbitron,Nunito,sans-serif;letter-spacing:.04em}

/* ===== HUD ===== */
.hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
  background:rgba(7,10,20,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--pur),var(--cyan));box-shadow:0 0 18px rgba(0,229,255,.45);flex:none}
.hud .who{flex:1;min-width:0}
.hud .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .lv{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:9px;background:#1b2347;overflow:hidden;margin-top:4px;position:relative}
.xpbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--pur),var(--pink));
  box-shadow:0 0 12px var(--cyan);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.chip{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:900;font-size:14px;flex:none}
.chip.xp{color:var(--gold)}
.chip.fire{color:#ff8a3d}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex:none}

/* ===== Layout ===== */
main{max-width:860px;margin:0 auto;padding:18px 14px 120px}
.view{animation:viewIn .45s cubic-bezier(.2,.9,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.hero{border-radius:var(--r);padding:22px;margin-bottom:18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(168,85,247,.35),rgba(0,229,255,.18));border:1px solid rgba(168,85,247,.5);box-shadow:var(--sh)}
.hero h1{font-size:clamp(22px,5vw,32px);line-height:1.1}
.hero p{color:#cdd3ff;margin-top:8px;font-size:15px}
.hero .big{position:absolute;right:-6px;bottom:-16px;font-size:96px;opacity:.25;transform:rotate(-12deg)}
.sec-t{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;margin:22px 4px 10px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{position:relative;text-align:left;border-radius:var(--r);padding:18px;background:var(--card);border:1px solid var(--line);
  overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.mcard:hover,.mcard:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 30px -6px var(--c)}
.mcard:active{transform:scale(.97)}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.mcard .em{font-size:38px;filter:drop-shadow(0 0 10px var(--c))}
.mcard h3{font-size:19px;margin:8px 0 2px}
.mcard .dt{font-size:13px;color:var(--mut)}
.mcard .cd{position:absolute;top:14px;right:14px;font-size:12px;font-weight:900;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--c)}
.prog{height:8px;border-radius:8px;background:#1b2347;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .6s}
.mcard .pt{font-size:12px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;margin-top:8px}
.tag.livro{background:rgba(34,255,136,.12);color:var(--ok)}
.tag.geral{background:rgba(255,210,63,.12);color:var(--gold)}

/* lista de tópicos */
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;margin-bottom:14px}
.topic{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:.2s}
.topic:hover{border-color:var(--c);transform:translateX(4px)}
.topic .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;background:rgba(255,255,255,.06);flex:none}
.topic.done .n{background:var(--c);color:#06101c;box-shadow:0 0 16px var(--c)}
.topic .tt{flex:1}
.topic .tt b{display:block;font-size:16px}
.topic .tt small{color:var(--mut)}
.stars{font-size:14px;letter-spacing:2px}
.gabbtn{width:100%;padding:16px;border-radius:16px;font-weight:900;font-size:16px;margin-top:8px;
  background:linear-gradient(135deg,rgba(255,210,63,.18),rgba(255,45,149,.15));border:1px dashed var(--gold);color:var(--gold)}

/* ===== Deck de cards ===== */
.deckhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.deckhead .back{margin:0}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:6px;border-radius:6px;background:#1f2852;transition:.3s}
.dots i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.dots i.q{background:#3a2550}
.dots i.q.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.stage{position:relative;min-height:440px;perspective:1200px}
.slide{position:relative;border-radius:24px;padding:26px 22px 24px;min-height:420px;background:linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.slide::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-90px;background:var(--c);opacity:.12;filter:blur(30px)}
.slide .kick{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.slide .emo{font-size:58px;margin:10px 0 4px;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.slide h2{font-size:clamp(21px,4.6vw,28px);line-height:1.15;margin:6px 0 12px}
.slide .tx{font-size:17px;line-height:1.55;color:#d9defc}
.slide .tx b,.slide .tx strong{color:#fff}
.slide .tx em{color:var(--c);font-style:normal;font-weight:800}
.slide .tx ul{margin:8px 0 0 0;list-style:none}
.slide .tx li{padding:7px 0 7px 28px;position:relative}
.slide .tx li::before{content:"▸";position:absolute;left:6px;color:var(--c);font-weight:900}
.slide .tx table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
.slide .tx td,.slide .tx th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.slide .tx th{color:var(--c);font-size:13px;text-transform:uppercase}
.box{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(0,229,255,.07);border-left:4px solid var(--c);font-size:15px}
.box.dica{background:rgba(255,210,63,.08);border-color:var(--gold)}
.pg{position:absolute;bottom:14px;right:18px;font-size:12px;color:var(--mut)}

.anim-in-right{animation:inR .5s cubic-bezier(.2,.9,.25,1.15) both}
.anim-in-left{animation:inL .5s cubic-bezier(.2,.9,.25,1.15) both}
.anim-out-left{animation:outL .32s ease-in both}
.anim-out-right{animation:outR .32s ease-in both}
@keyframes inR{from{opacity:0;transform:translateX(110%) rotate(8deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-110%) rotate(-8deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes outL{to{opacity:0;transform:translateX(-120%) rotate(-10deg) scale(.85)}}
@keyframes outR{to{opacity:0;transform:translateX(120%) rotate(10deg) scale(.85)}}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(7,10,20,.98),rgba(7,10,20,.75));backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.navbar .in{max-width:860px;margin:0 auto;display:flex;gap:10px}
.btn{padding:15px 18px;border-radius:16px;font-weight:900;font-size:16px;background:var(--card);border:1px solid var(--line);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.95)}
.btn.go{flex:1;background:linear-gradient(135deg,var(--c),var(--pur));color:#05080f;box-shadow:0 0 22px -4px var(--c);font-family:Orbitron,Nunito,sans-serif;letter-spacing:.06em}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.go.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 34px 2px var(--c)}}

/* ===== Quiz ===== */
.qbadge{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,45,149,.15);color:var(--pink);font-weight:900;font-size:12px;letter-spacing:.12em}
.qtx{font-size:clamp(19px,4.2vw,23px);font-weight:900;line-height:1.3;margin:14px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:#0f1630;border:2px solid var(--line);font-size:16px;font-weight:700;transition:border-color .2s,background .2s,transform .12s}
.opt:hover{border-color:var(--c)}
.opt .L{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:900;flex:none}
.opt.wrong{border-color:var(--bad);background:rgba(255,59,92,.16);animation:shake .5s;color:#ffd0d8}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt.right{border-color:var(--ok);background:rgba(34,255,136,.14);animation:glow 1.1s ease-out;color:#d9ffe9}
.opt.right .L{background:var(--ok);color:#03140b}
.opt.dim{opacity:.4}
.opts.lock .opt{pointer-events:none}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(34,255,136,.9)}60%{box-shadow:0 0 0 14px rgba(34,255,136,0)}100%{box-shadow:0 0 22px rgba(34,255,136,.35)}}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:15px;line-height:1.45;animation:viewIn .35s}
.fb.ok{background:rgba(34,255,136,.1);border:1px solid rgba(34,255,136,.45)}
.fb.no{background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.45)}
.fb b{font-size:17px}
.slide.flash-bad{animation:flashBad .5s}
@keyframes flashBad{30%{box-shadow:0 0 0 3px var(--bad),0 0 40px rgba(255,59,92,.5)}}

/* resultado */
.result{text-align:center;padding-top:10px}
.result .trophy{font-size:84px;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.result .st{font-size:40px;letter-spacing:6px;margin:6px 0}
.result .st span{display:inline-block;animation:pop .5s both}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{padding:12px;border-radius:14px;background:rgba(255,255,255,.05)}
.kpi b{display:block;font-size:22px;font-family:Orbitron,sans-serif;color:var(--c)}
.kpi small{color:var(--mut);font-size:12px}

/* ===== Gabarito ===== */
.gq{border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.gq summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:800;display:flex;gap:10px;align-items:flex-start}
.gq summary::-webkit-details-marker{display:none}
.gq summary::before{content:"🔒";flex:none}
.gq[open] summary::before{content:"🔓"}
.gq summary small{display:block;color:var(--mut);font-weight:600;margin-top:2px}
.gq .ans{padding:0 16px 16px 44px;color:#d5ffe6;line-height:1.55;animation:viewIn .3s}
.gq .ans ul{margin-left:18px}
.gq .ans table{border-collapse:collapse;margin-top:6px;font-size:14px;width:100%}
.gq .ans td,.gq .ans th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.gq .ans th{color:var(--gold)}
.pghead{font-size:12px;color:var(--gold);font-weight:900;letter-spacing:.12em;margin:18px 4px 8px}

/* ===== Overlays ===== */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(3,5,12,.82);backdrop-filter:blur(8px);animation:viewIn .3s}
.modal{width:100%;max-width:420px;border-radius:24px;padding:26px;background:linear-gradient(160deg,#1a2350,#101633);border:1px solid var(--pur);box-shadow:0 0 60px rgba(168,85,247,.4);text-align:center}
.modal h2{font-size:24px;margin:8px 0}
.modal p{color:#cbd1ff}
.modal input{width:100%;margin:16px 0 10px;padding:14px;border-radius:14px;border:2px solid var(--line);background:#0b1026;color:#fff;font:inherit;font-size:17px;font-weight:800;text-align:center;outline:none}
.modal input:focus{border-color:var(--cyan)}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px}
.avs button{width:46px;height:46px;border-radius:14px;font-size:24px;background:#0b1026;border:2px solid var(--line)}
.avs button.sel{border-color:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.plist{display:grid;gap:8px;margin:12px 0}
.plist button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#0b1026;border:1px solid var(--line);font-weight:800;text-align:left}
.plist button small{margin-left:auto;color:var(--gold)}
.lvup .big{font-size:90px;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.lvup h2{font-size:30px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;top:76px;z-index:120;transform:translateX(-50%);padding:10px 18px;border-radius:999px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),#ff9d00);color:#1a1000;box-shadow:0 0 30px rgba(255,210,63,.6);animation:toast 1.6s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:28px;line-height:1.6}
/* ===== v2: modos, narrador, conquistas, simulado, resumão ===== */
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpis.k4 .kpi{padding:10px 6px}
.kpis.k4 .kpi b{font-size:18px}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
.modo::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.modo:hover,.modo:focus-visible{border-color:var(--c);transform:translateY(-3px);box-shadow:0 10px 24px -8px var(--c)}
.modo:active{transform:scale(.97)}
.modo .mi{font-size:30px;filter:drop-shadow(0 0 8px var(--c))}
.modo b{font-size:15px}
.modo small{color:var(--mut);font-size:12px;line-height:1.35}
.modo.wide{grid-column:1/-1}
.modo .num{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:3px 9px}
.modo.vazio{opacity:.55}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;margin-top:10px;text-align:left}
.toggle small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.sw{width:48px;height:28px;border-radius:28px;background:#2a3463;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.toggle.on .sw::after{left:24px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bdg{padding:10px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:11px;color:var(--mut);line-height:1.3}
.bdg i{display:block;font-style:normal;font-size:28px;filter:grayscale(1) opacity(.3)}
.bdg b{display:block;color:var(--mut);font-size:12px;margin:4px 0 2px}
.bdg.on{border-color:var(--gold);background:linear-gradient(160deg,rgba(255,210,63,.12),var(--card));box-shadow:0 0 16px -6px var(--gold)}
.bdg.on i{filter:drop-shadow(0 0 8px rgba(255,210,63,.6))}
.bdg.on b{color:var(--gold)}
.ouvir{position:absolute;top:16px;right:16px;z-index:2;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:900;font-size:13px}
.ouvir.on{background:var(--c);color:#05080f;border-color:transparent;animation:pulse 1.2s infinite}
.timer{height:9px;border-radius:9px;background:#1b2347;overflow:hidden;margin:14px 0 0}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--gold),var(--ok));transform-origin:left;animation:tempo linear forwards}
@keyframes tempo{to{transform:scaleX(0)}}
.nota{font-family:Orbitron,Nunito,sans-serif;font-size:72px;font-weight:800;line-height:1;margin:8px 0 2px;color:var(--c);text-shadow:0 0 30px var(--c);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.nota small{font-size:26px;color:var(--mut);text-shadow:none}
.rev{text-align:left;margin-top:18px}
.rev .ri{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);margin-bottom:8px;font-size:14px;line-height:1.45}
.rev .ri b.ok{color:var(--ok)}
.rev .ri small{color:var(--mut)}
.resumo .rt{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:18px;font-weight:900;color:var(--c)}
.resumo .rt span{flex:1}
.resumo .rt small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.resumo .rt .ouvir{position:static;flex:none}
.resumo .rc{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);margin-bottom:8px;font-size:14px;line-height:1.5}
.resumo .rc h4{font-size:15px;margin-bottom:4px}
.resumo .rc table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.resumo .rc td,.resumo .rc th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}

/* ===== GABARITO das atividades do livro (respostas sugeridas) =====
   p: resposta pessoal (damos um exemplo) */
const GABARITO = {
 cie:[
  {pg:'p. 123', q:'1. Pinte os oceanos de azul e os continentes de marrom.', r:'Atividade de pintura: oceanos em azul e continentes em marrom.'},
  {pg:'p. 124', q:'2. Qual lápis foi mais usado: o marrom ou o azul? Por quê?', r:'O <b>azul</b>, porque a maior parte da superfície da Terra (cerca de 3/4) é coberta por água.'},
  {pg:'p. 125', q:'3. Quais rios ficam perto do seu município? Qual abastece a cidade?', r:'Resposta pessoal. Pesquise o rio da sua cidade e de qual barragem ou açude vem a água.', p:1},
  {pg:'p. 125', q:'4. Sua cidade tem estação de tratamento de água? Qual empresa?', r:'Resposta pessoal. Ex.: em Pernambuco, o serviço é da <b>Compesa</b>.', p:1},
  {pg:'p. 126', q:'Minhas descobertas 1. Ilustre o que observou na projeção.', r:'Desenhar os pontinhos, sujeiras e “bichinhos” (microrganismos) que apareceram na parede.'},
  {pg:'p. 126', q:'2. Você usaria essa água no dia a dia? Por quê?', r:'<b>Não</b>, porque ela tem sujeira e microrganismos que podem causar doenças.'},
  {pg:'p. 126', q:'3. Quais procedimentos seriam necessários para purificá-la?', r:'Filtrar, ferver e colocar cloro – ou tratar como na ETA: flocos, decantação, filtração e cloração.'},
  {pg:'p. 128', q:'Investigue: Qual é a relevância das florestas para o ciclo da água?', r:'As plantas transpiram e soltam vapor d’água, que ajuda a formar nuvens e <b>chuva</b>; as raízes seguram o solo e ajudam a água a infiltrar, abastecendo nascentes e lençóis subterrâneos.'},
  {pg:'p. 128', q:'5a. Importância da chuva para a agricultura.', r:'A chuva rega as plantações naturalmente, permitindo que os alimentos cresçam.'},
  {pg:'p. 128', q:'5b. Clima.', r:'A chuva deixa o ar mais úmido e ajuda a equilibrar (refrescar) a temperatura.'},
  {pg:'p. 128', q:'5c. Produção de energia elétrica.', r:'A chuva enche rios e <b>represas das hidrelétricas</b>; a água em movimento gira as turbinas e gera eletricidade.'},
  {pg:'p. 128', q:'5d. Fornecimento de água potável.', r:'A chuva abastece rios, represas e lençóis subterrâneos, de onde a água é captada e tratada para chegar às casas.'},
  {pg:'p. 128', q:'5e. Equilíbrio de ecossistemas.', r:'Mantém rios, lagos e florestas vivos; plantas e animais dependem da água da chuva para sobreviver.'},
  {pg:'p. 129', q:'6. A chuva causa danos na sua cidade? Que medidas tomar?', r:'Resposta pessoal. Medidas: não jogar lixo na rua, limpar os bueiros, coleta de lixo regular, preservar áreas verdes.', p:1},
  {pg:'p. 129', q:'7. Decifre o código.', r:'<b>“NÃO JOGUE LIXO NAS RUAS, POIS ELE ENTOPE OS BUEIROS.”</b>'},
  {pg:'p. 129', q:'8. Proposta para resolver o problema.', r:'Ex.: campanha na escola e no bairro com cartazes, mais lixeiras nas ruas, mutirão de limpeza e coleta seletiva.', p:1},
  {pg:'p. 130', q:'Minhas descobertas 1. Anote as temperaturas no quadro.', r:'Conforme o experimento. Esperado: a <b>areia</b> fica mais fria na geladeira e mais quente no sol; a <b>água</b> muda menos.'},
  {pg:'p. 130', q:'2. O que aconteceu com a temperatura da água e da areia?', r:'As duas mudaram, mas a <b>areia</b> esquentou e esfriou <b>mais rápido</b>; a <b>água</b> mudou <b>mais devagar</b>.'},
  {pg:'p. 130', q:'3. O que é possível concluir?', r:'A água demora mais para esquentar e esfriar; por isso a grande quantidade de água na Terra <b>equilibra a temperatura</b> do planeta.'},
  {pg:'p. 131', q:'9. Para onde vai a água que você usa em casa?', r:'Vai para o <b>esgoto</b>, pelos encanamentos, até a <b>Estação de Tratamento de Esgoto (ETE)</b>.'},
  {pg:'p. 131', q:'10. Existe ETE em sua cidade?', r:'Resposta pessoal (no livro foi marcado “Sim”).', p:1},
  {pg:'p. 131', q:'11. O tratamento do esgoto favorece a natureza? Justifique.', r:'Resposta pessoal. Ex.: Sim, porque o esgoto é limpo antes de voltar aos rios, protegendo peixes, plantas e pessoas.', p:1},
  {pg:'p. 131', q:'12. Opinião sobre jogar esgoto sem tratamento em rios. Conselho?', r:'É errado: polui a água, mata peixes e espalha doenças. Conselho: ligar a casa à rede de esgoto (ou fazer fossa adequada) e cobrar saneamento das autoridades.'},
  {pg:'p. 134', q:'1. Como aumentar o tempo de disponibilidade dos combustíveis fósseis?', r:'Economizar energia e combustível, usar transporte coletivo, bicicleta, carona e trocar por biocombustíveis e energias limpas (solar, eólica, hidráulica).'},
  {pg:'p. 135', q:'2. Por que o “homem linha” alterou as imagens do muro?', r:'Alternativa <b>c)</b>: ele incentivou o uso de energias <b>renováveis</b> que não agridem o ambiente.'},
  {pg:'p. 137', q:'Disco de Newton 1. Quais cores estão no disco?', r:'Vermelho, laranja, amarelo, verde, azul, anil e violeta.'},
  {pg:'p. 137', q:'2. Ao ser girado, que cor o disco apresenta?', r:'<b>Branca</b> (esbranquiçada).'},
  {pg:'p. 137', q:'3. Por que esse fenômeno acontece?', r:'Girando rápido, nossos olhos misturam as 7 cores, e a mistura delas forma a <b>luz branca</b>.'},
  {pg:'p. 137', q:'4. Já viu a luz branca se decompor em outra situação?', r:'Sim: no <b>arco-íris</b>, num prisma, em bolhas de sabão, num CD ou no jato de uma mangueira no sol.'},
  {pg:'p. 138', q:'3. Em quais atividades usamos a energia solar?', r:'Secar roupas no varal, aquecer a água (aquecedor solar), gerar eletricidade (placas solares), iluminar os ambientes, secar alimentos; as plantas fazem fotossíntese.'},
  {pg:'p. 138', q:'4. Se a luz solar não existisse, o que aconteceria?', r:'O planeta ficaria escuro e muito frio, as plantas não fariam fotossíntese, faltaria alimento, o ciclo da água pararia e não haveria vida.'},
  {pg:'p. 140', q:'Propagação sonora 1. O que aconteceu com os grãos de arroz? Por quê?', r:'Os grãos <b>pularam</b>, porque o som faz o ar e o papel-celofane <b>vibrarem</b>.'},
  {pg:'p. 140', q:'2. Quando o volume aumentou, o que ocorreu?', r:'Os grãos pularam <b>mais forte</b> (a vibração aumentou).'},
  {pg:'p. 140', q:'3. Som alto pode prejudicar a audição? Por quê?', r:'Sim. A vibração forte e rápida pode machucar o tímpano e causar perda de audição.'},
  {pg:'p. 141', q:'5. Quais tipos de energia aparecem na imagem?', r:'Energia do <b>movimento</b> (crianças correndo, bola, carro, carrinho de sorvete), <b>química</b> (alimentos das crianças, combustível do carro), <b>sonora</b> (pássaros cantando, carro), <b>luminosa e térmica</b> (Sol).'},
  {pg:'p. 142', q:'6. Energia produzida a partir da energia elétrica.', r:'a) Ventilador: <b>movimento</b> • b) Abajur: <b>luminosa</b> • c) Chuveiro: <b>térmica</b> • d) Aparelho de som: <b>sonora</b> • e) Computador: <b>luminosa, sonora e térmica</b>.'},
  {pg:'p. 144', q:'Levantando hipóteses 1, 2 e 3.', r:'1. Energia <b>elétrica</b>. 2. Energia <b>magnética</b> (magnetismo). 3. Sim: a corrente elétrica cria campo magnético (eletroímã) e ímãs em movimento geram eletricidade (dínamo).'},
  {pg:'p. 145', q:'1a. Assinale os utensílios que dependem de energia elétrica.', r:'Chuveiro elétrico, computador, micro-ondas, televisão (e lâmpadas).'},
  {pg:'p. 145', q:'1b. Atividades sem e com eletricidade.', r:'<b>Sem:</b> dormir, jogar dominó, lavar louça na pia. <b>Com:</b> tomar banho no chuveiro elétrico, usar o computador, esquentar comida no micro-ondas, assistir TV.'},
  {pg:'p. 147', q:'Eletricidade estática 1. Por que a régua atraiu os papéis?', r:'Porque, ao ser esfregada no cabelo, a régua ficou <b>eletrizada</b> (com cargas elétricas) e atraiu os papéis: é a <b>eletricidade estática</b>.'},
  {pg:'p. 147', q:'2. Já viu esse fenômeno em outra situação?', r:'Ex.: cabelo arrepiado ao pentear, choquinho ao tocar a maçaneta ou outra pessoa, balão que gruda na parede depois de esfregado no cabelo.'},
  {pg:'p. 147', q:'3. O que acontece quando esfregamos uma mão na outra?', r:'As mãos <b>esquentam</b>: o atrito produz calor (energia térmica).'},
  {pg:'p. 148', q:'2. Como o eletricista se protege da corrente elétrica?', r:'Usando equipamentos <b>isolantes</b>: luvas e botas de <b>borracha</b>, capacete e escada/ferramentas com cabo isolante.'},
  {pg:'p. 148', q:'3. O que fazer em cada situação de risco?', r:'🚿 Chuveiro: não mexer nele ligado ou com o corpo molhado; desligar o disjuntor e chamar um eletricista. 🔌 Tomada com benjamim: não ligar vários aparelhos na mesma tomada. ✂️ Criança na tomada: nunca colocar dedos ou objetos de metal; usar protetor de tomada.'},
  {pg:'p. 150', q:'4a. Como é uma lâmpada incandescente por dentro?', r:'Tem um <b>filamento</b> (fio bem fino) preso a fios condutores, dentro de um bulbo de vidro sem ar. A corrente esquenta o filamento, que brilha.'},
  {pg:'p. 150', q:'4b. O que possibilita o funcionamento das lâmpadas?', r:'A <b>corrente elétrica</b> passando por um circuito fechado.'},
  {pg:'p. 150', q:'4c. A terceira lâmpada pode ser acesa? Por quê?', r:'<b>Não</b>, porque está <b>queimada</b> (filamento rompido): o circuito fica aberto e a corrente não passa.'},
  {pg:'p. 151', q:'5a. Por que em A a lâmpada está apagada e em B acesa?', r:'Em A o interruptor está desligado: <b>circuito aberto</b>, a corrente não passa. Em B está ligado: <b>circuito fechado</b>, a corrente chega à lâmpada.'},
  {pg:'p. 151', q:'5b. Função do interruptor, da pilha e dos fios.', r:'<b>Interruptor:</b> abre e fecha o circuito (liga/desliga). <b>Pilha:</b> fonte de energia, fornece a corrente. <b>Fios:</b> conduzem a corrente.'},
  {pg:'p. 153', q:'Lanterna 1. Por que a lâmpada acende quando um fio encosta no outro?', r:'Porque o circuito <b>fecha</b> e a corrente elétrica passa até a lâmpada.'},
  {pg:'p. 153', q:'2. De onde vem a energia elétrica que acende a lâmpada? Por quê?', r:'Das <b>pilhas</b>, que transformam energia química em energia elétrica.'},
  {pg:'p. 153', q:'3. Classifique os materiais em condutores e isolantes.', r:'<b>Condutores:</b> fios (metal por dentro), papel-alumínio, pilhas, soquete/lâmpada. <b>Isolantes:</b> embalagem plástica de detergente, fita adesiva, algodão, capa plástica dos fios.'},
  {pg:'p. 154', q:'6a. Objetivo do horário de verão. Vantagens? Para quem?', r:'Aproveitar mais a luz do dia e <b>economizar energia elétrica</b> (menos lâmpadas acesas no fim da tarde). Vantagem para o país, para o sistema elétrico e para a população.'},
  {pg:'p. 154', q:'6b. Por que só alguns estados participam?', r:'Porque só os estados mais distantes da linha do Equador (Sul, Sudeste e Centro-Oeste) têm dias bem mais longos no verão; perto do Equador os dias têm quase a mesma duração o ano todo.'},
  {pg:'p. 154', q:'6c. Seu estado adota o horário de verão?', r:'Resposta pessoal. Os estados do Nordeste normalmente não adotam, e o horário de verão está suspenso no Brasil desde 2019.', p:1},
  {pg:'p. 155', q:'7. Como Dona Ana pode recolher os alfinetes sem pegar um por um?', r:'Usando um <b>ímã</b>: os alfinetes de metal são atraídos por ele.'},
  {pg:'p. 157', q:'Polos 1, 2 e 3.', r:'1. Polos diferentes se <b>atraíram</b> (grudaram). 2. Polos iguais se <b>repeliram</b> (se afastaram). 3. Mesmo sem encostar, a força age (campo magnético): quanto mais perto, mais forte a atração ou a repulsão.'},
  {pg:'p. 159', q:'8a. Um parafuso será atraído por um ímã se for…', r:'<b>(X) de ferro ou de níquel.</b>'},
  {pg:'p. 159', q:'8b. Ferro e alumínio perto de um ímã:', r:'<b>(X) O pedaço de alumínio não será atraído, pois não sofrerá magnetismo.</b>'},
  {pg:'p. 160', q:'Miniguindaste 1. O que acontece ao aproximar o eletroímã dos clipes? Por quê?', r:'Os clipes de <b>metal</b> são atraídos, porque a corrente da pilha passando pelo fio enrolado transforma o prego em um <b>eletroímã</b>.'},
  {pg:'p. 160', q:'2. Teste outros objetos.', r:'Ex.: clipe de metal – atraído • clipe de plástico – não atraído • prego/tachinha – atraído • borracha, papel, lápis – não atraídos.'}

 por:[
  {pg:'p. 40', q:'38. Organize: pássaro, também, indígena, privilégio, líder, kayapó.', r:'<b>Proparoxítonas:</b> pássaro, indígena • <b>Paroxítonas:</b> privilégio, líder • <b>Oxítonas:</b> também, kayapó.'},
  {pg:'p. 40', q:'38a. O acento gráfico marca a sílaba pronunciada…', r:'<b>(X) com mais intensidade.</b> (Nessas palavras, o acento agudo também indica som aberto.)'},
  {pg:'p. 40', q:'38b. As paroxítonas foram acentuadas porque terminam com…', r:'<b>(X) ditongo</b> (privilé-gio) e <b>(X) R</b> (líder).'},
  {pg:'p. 40', q:'38c. Outras paroxítonas acentuadas no texto.', r:'Ex.: memória, própria, língua, história (confira no texto).'},
  {pg:'p. 40', q:'“Por que não aparecem proparoxítonas sem acento?”', r:'Porque <b>todas as proparoxítonas são acentuadas</b> na língua portuguesa.'},
  {pg:'p. 49', q:'10a. Por que sabemos que quem diz “Anita” é a professora?', r:'Por causa do <b>travessão</b> que separa a fala e da explicação do narrador: “a professora <b>diz</b> meu nome em voz alta”.'},
  {pg:'p. 49', q:'10b. Que sinal aparece antes do nome no trecho A? Por quê?', r:'O <b>travessão (–)</b>, usado para indicar a <b>fala do personagem</b> (discurso direto).'},
  {pg:'p. 49', q:'10c. A autora só usa esse sinal para a fala direta?', r:'Não. O travessão também separa o <b>comentário do narrador</b> depois da fala, como em “– Achei! <b>– dou um salto</b>.”'},
  {pg:'p. 49', q:'10d. Em qual trecho a narradora coloca a fala dentro do próprio texto?', r:'No <b>trecho B</b>: não há travessão; a narradora conta com as palavras dela o que a professora disse (discurso <b>indireto</b>).'},
  {pg:'p. 49', q:'11. Diferenças entre o trecho B e o A.', r:'No B não há travessão nem exclamação; o verbo está no passado (“dizia”); o nome fica entre vírgulas; quem conta é a narradora (discurso indireto).'},
  {pg:'p. 49', q:'12. Transforme em discurso direto.', r:'Anita olhava para a exposição de sua xará e dizia:<br><b>– Estou encantada!</b>'},
  {pg:'p. 50', q:'13. Qual discurso chama mais a atenção do leitor? Explique.', r:'O <b>discurso direto</b>, porque mostra a fala exata do personagem, com emoção e travessão, como se o leitor estivesse ouvindo.'},
  {pg:'p. 50', q:'14. Copie três trechos com discurso direto.', r:'“– Anita! – a professora diz meu nome em voz alta.” • “– Achei! – dou um salto.” • “– Anita com Anita, e fim de papo.”'},
  {pg:'p. 50', q:'15. Verbos que aparecem antes ou depois da fala.', r:'Ex.: <b>diz, aviso, decreta, dou (um salto)</b>; outros verbos de dizer: falar, gritar, perguntar, responder.'},
  {pg:'p. 50', q:'16. Continue a crônica com um diálogo entre Anita e Mário.', r:'Produção pessoal. Use travessão em cada fala e verbos de dizer. Ex.: – Oi, Mário! – disse Anita. – Vamos andar de skate? – Bora! – respondeu ele.', p:1},
  {pg:'p. 57', q:'27. Responda com versos do texto.', r:'a) Na cabeça: “E o palácio da memória é a cabeça.” • b) “O bebê, quando nasce, chora de alegria.” • c) “A lembrança é muito útil.” (confira os versos no poema da p. 54).'},
  {pg:'p. 57', q:'28. Sentido se trocar “uma” e “a” de lugar.', r:'Ficaria “Cada ano é <b>a</b> paisagem nova…” e “E <b>uma</b> memória é sempre nova”. Muda o sentido: <b>uma</b> (indefinido) fala de algo qualquer; <b>a</b> (definido) fala de algo específico, já conhecido.'},
  {pg:'p. 57', q:'29. Poderia trocar “o” e “a” em “o palácio da memória é a cabeça”?', r:'<b>Não</b>, porque o artigo combina em gênero com o substantivo: <b>o palácio</b> (masculino), <b>a cabeça</b> (feminino).'},
  {pg:'p. 58', q:'30a. “soninho” e “memória” são…', r:'<b>(X) substantivos.</b>'},
  {pg:'p. 58', q:'30b. Quais palavras aparecem antes delas?', r:'<b>o</b> (o soninho) e <b>a</b> (a memória) – são artigos.'},

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ANO = 2026;
const TITULOS = ['Novato','Aprendiz','Explorador','Estudante Ninja','Cientista Jr.','Mestre do Saber','Lenda da Turma','Gênio Supremo','Imortal do 5º Ano'];
const AVATARES = ['🎮','🦊','🐼','🐯','🦄','🐸','🤖','👾','🐉','🦖','🐙','⚽','🎧','🚀','🧙','🦸'];

/* ---------- Salvamento (vários jogadores no mesmo aparelho) ---------- */
const KEY = 'estudoGamer.av2.v1';
let DB = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
DB.players = DB.players || {};
if (DB.sound === undefined) DB.sound = true;
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} };
const P = () => DB.players[DB.current];
function novoJogador(nome, av) {
  const id = 'p' + Date.now().toString(36);
  DB.players[id] = {nome, av, xp:0, seen:{}, done:{}, combo:0, maxCombo:0, acertos:0, erros:0};
  DB.current = id; norm(DB.players[id]); salvar();
}

/* ---------- Níveis ---------- */
const precisa = n => 100 + (n - 1) * 60;           // XP para passar do nível n
function nivel(xp) {
  let n = 1, resto = xp;
  while (resto >= precisa(n)) { resto -= precisa(n); n++; }
  return {n, resto, meta: precisa(n), titulo: TITULOS[Math.min(n - 1, TITULOS.length - 1)]};
}

/* ---------- Som (Web Audio, sem arquivos) ---------- */
let AC = null;
function tom(freq, dur, tipo = 'sine', vol = .12, atraso = 0) {
  if (!DB.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + atraso;
    o.type = tipo; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const SFX = {
  swipe: () => tom(520, .08, 'triangle', .06),
  ok:    () => { tom(660, .12, 'square', .07); tom(880, .14, 'square', .07, .1); tom(1320, .22, 'square', .06, .2); },
  no:    () => { tom(180, .25, 'sawtooth', .09); tom(140, .3, 'sawtooth', .08, .12); },
  xp:    () => tom(1200, .06, 'triangle', .05),
  lvl:   () => [523, 659, 784, 1047, 1319].forEach((f, i) => tom(f, .25, 'square', .07, i * .11)),
  win:   () => [784, 988, 1175, 1568].forEach((f, i) => tom(f, .22, 'triangle', .09, i * .12))
};

/* ---------- Confete ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let pecas = [], animando = false;
function confete(qtd = 140) {
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#00e5ff','#a855f7','#ff2d95','#22ff88','#ffd23f','#ff8a3d'];
  for (let i = 0; i < qtd; i++) pecas.push({x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * 7 + 4, c: cores[i % cores.length],
    a: Math.random() * 6, va: (Math.random() - .5) * .4, vida: 140 + Math.random() * 60});
  if (!animando) { animando = true; requestAnimationFrame(passo); }
}
function passo() {
  cx.clearRect(0, 0, cv.width, cv.height);
  pecas = pecas.filter(p => p.vida-- > 0 && p.y < cv.height + 40);
  for (const p of pecas) {
    p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
    cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
  }
  if (pecas.length) requestAnimationFrame(passo); else { animando = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------- HUD, XP e avisos ---------- */
function hud() {
  const p = P(); if (!p) return;
  const L = nivel(p.xp);
  $('#hudAv').textContent = p.av; $('#hudNm').textContent = p.nome;
  $('#hudLv').textContent = 'Nível ' + L.n; $('#hudTitle').textContent = L.titulo;
  $('#hudXpTxt').textContent = L.resto + '/' + L.meta + ' XP';
  $('#hudBar').style.width = (L.resto / L.meta * 100) + '%';
  $('#hudXp').textContent = p.xp; $('#hudCombo').textContent = p.combo;
  $('#btnSom').textContent = DB.sound ? '🔊' : '🔇';
}
function toast(txt) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = txt;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1650);
}
function ganharXP(qtd, motivo) {
  const p = P(); const antes = nivel(p.xp).n;
  p.xp += qtd; marcaDia(); salvar(); hud();
  setTimeout(checaConquistas, 700);
  toast('+' + qtd + ' XP' + (motivo ? ' • ' + motivo : '')); SFX.xp();
  const depois = nivel(p.xp);
  if (depois.n > antes) setTimeout(() => subiuNivel(depois), 500);
}
function subiuNivel(L) {
  SFX.lvl(); confete(220); if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 120]);
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = '<div class="modal lvup"><div class="big">🏆</div><h2 class="orb">LEVEL UP!</h2>' +
    '<p>Você chegou ao <b>Nível ' + L.n + '</b><br>Novo título: <b>' + esc(L.titulo) + '</b></p>' +
    '<button class="btn go" style="width:100%;margin-top:18px;--c:var(--gold)">BORA CONTINUAR! 🚀</button></div>';
  ov.querySelector('button').onclick = () => ov.remove();
  document.body.appendChild(ov);
}

/* ---------- Perfil (nome + avatar) ---------- */
function telaPerfil(podeFechar) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const lista = Object.entries(DB.players).sort((a, b) => b[1].xp - a[1].xp);
  let av = AVATARES[Math.floor(Math.random() * AVATARES.length)];
  ov.innerHTML = '<div class="modal">' +
    '<div style="font-size:52px">🎮</div><h2 class="orb">ESTUDO GAMER</h2><p>AV2 de Dezembro • 5º Ano</p>' +
    (lista.length ? '<div class="sec-t" style="margin:16px 0 0">🏅 Ranking da galera</div><div class="plist">' +
      lista.map(([id, p], i) => '<button data-id="' + id + '"><span>' + (['🥇','🥈','🥉'][i] || '🎖️') + '</span><span>' + p.av + ' ' + esc(p.nome) + '</span><small>Nv ' + nivel(p.xp).n + ' • ' + p.xp + ' XP</small></button>').join('') + '</div>' : '') +
    '<div class="sec-t" style="margin:16px 0 0">' + (lista.length ? '➕ Novo jogador' : 'Crie seu jogador') + '</div>' +
    '<input id="inNome" maxlength="16" placeholder="Seu nome ou apelido" autocomplete="off">' +
    '<div class="avs">' + AVATARES.map(a => '<button class="' + (a === av ? 'sel' : '') + '">' + a + '</button>').join('') + '</div>' +
    '<button class="btn go" id="btnCriar" style="width:100%;--c:var(--cyan)">COMEÇAR ▶</button>' +
    (podeFechar ? '<button class="btn" id="btnFechar" style="width:100%;margin-top:8px">Voltar</button>' : '') + '</div>';
  document.body.appendChild(ov);
  ov.querySelectorAll('.avs button').forEach(b => b.onclick = () => {
    ov.querySelectorAll('.avs button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); av = b.textContent; SFX.swipe();
  });
  ov.querySelectorAll('.plist button').forEach(b => b.onclick = () => { DB.current = b.dataset.id; norm(P()); salvar(); ov.remove(); hud(); home(); });
  const criar = () => {
    const nome = $('#inNome').value.trim();
    if (!nome) { $('#inNome').focus(); $('#inNome').style.borderColor = 'var(--bad)'; SFX.no(); return; }
    novoJogador(nome, av); ov.remove(); hud(); home(); SFX.win(); confete(90);
  };
  $('#btnCriar').onclick = criar;
  $('#inNome').onkeydown = e => { if (e.key === 'Enter') criar(); };
  if (podeFechar) $('#btnFechar').onclick = () => ov.remove();
  setTimeout(() => $('#inNome').focus(), 50);
}
$('#btnPerfil').onclick = () => telaPerfil(true);
$('#btnSom').onclick = () => { DB.sound = !DB.sound; salvar(); hud(); SFX.swipe(); };

/* ---------- Utilidades de tela ---------- */
const totalTopicos = () => MATERIAS.reduce((s, m) => s + m.topicos.length, 0);
const concluidos = () => Object.keys(P().done).length;
const estrelasTot = () => Object.values(P().done).reduce((s, d) => s + d.stars, 0);
const starsTxt = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
const vibra = padrao => { try { if (navigator.vibrate) navigator.vibrate(padrao); } catch (e) {} };
function diasPara(ddmm) {
  const [d, m] = ddmm.split('/').map(Number);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  return Math.round((new Date(ANO, m - 1, d) - hoje) / 864e5);
}
const quando = n => n > 1 ? 'em ' + n + ' dias' : n === 1 ? 'AMANHÃ!' : n === 0 ? 'HOJE!' : 'já foi ✔';
function tela(html, comNav) {
  if (typeof calar === 'function') calar();

}

MATERIAS.forEach(m => m.topicos.forEach(t => t.quiz.forEach((q, i) => { q.id = t.id + ':' + i; QIDX[q.id] = {q, m, t}; })));
function norm(p) {
  p.wrong = p.wrong || {}; p.badges = p.badges || {}; p.simu = p.simu || {};
  p.streak = p.streak || 0; p.dominadas = p.dominadas || 0; p.relBest = p.relBest || 0;
  return p;
}

/* ---------- Sequência de dias estudando ---------- */
const diaStr = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
function marcaDia() {
  const p = P(), hoje = diaStr(new Date());
  if (p.lastDay === hoje) return;
  const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  p.streak = p.lastDay === diaStr(ontem) ? p.streak + 1 : 1;
  p.lastDay = hoje;
  if (p.streak > 1) setTimeout(() => toast('🔥 ' + p.streak + ' dias seguidos estudando!'), 1900);
}

  {id:'fase1', e:'🏁', n:'Primeira fase', d:'Conclua 1 fase', ok: p => Object.keys(p.done).length >= 1},
  {id:'combo5', e:'🔥', n:'Pegando fogo', d:'Combo x5', ok: p => p.maxCombo >= 5},
  {id:'combo10', e:'☄️', n:'Imparável', d:'Combo x10', ok: p => p.maxCombo >= 10},
  {id:'perf', e:'⭐', n:'Perfeição', d:'3 estrelas numa fase', ok: p => Object.values(p.done).some(d => d.stars === 3)},
  {id:'fases10', e:'📚', n:'Maratonista', d:'Conclua 10 fases', ok: p => Object.keys(p.done).length >= 10},
  {id:'tudo', e:'👑', n:'Zerou o jogo', d:'Conclua as 21 fases', ok: p => Object.keys(p.done).length >= totalTopicos()},
  {id:'aprov', e:'📝', n:'Aprovado!', d:'Nota 7+ num simulado', ok: p => Object.values(p.simu).some(n => n >= 7)},
  {id:'dez', e:'💯', n:'Nota 10', d:'Gabarite um simulado', ok: p => Object.values(p.simu).some(n => n >= 10)},
  {id:'simus', e:'🎓', n:'Pronto pra AV2', d:'Nota 7+ nos 6 simulados', ok: p => MATERIAS.every(m => (p.simu[m.id] || 0) >= 7)},
  {id:'erros', e:'🧠', n:'Aprendi com os erros', d:'Supere 5 erros', ok: p => p.dominadas >= 5},
  {id:'rel', e:'⚡', n:'Raio veloz', d:'9+ no Relâmpago', ok: p => p.relBest >= 9},
  {id:'streak3', e:'📆', n:'Constância', d:'3 dias seguidos', ok: p => p.streak >= 3},
  {id:'xp1000', e:'💎', n:'Mil XP', d:'Junte 1.000 XP', ok: p => p.xp >= 1000}
].concat(MATERIAS.map(m => ({id:'m_' + m.id, e:m.em, n:'Mestre: ' + m.nome, d:'3 estrelas em tudo', ok: p => m.topicos.every(t => p.done[t.id] && p.done[t.id].stars === 3)})));
function checaConquistas() {
  const p = P(); if (!p) return;
  const novas = CONQ.filter(c => !p.badges[c.id] && c.ok(p));
  if (!novas.length) return;
  novas.forEach(c => p.badges[c.id] = Date.now()); salvar();
  novas.forEach((c, i) => setTimeout(() => {
    SFX.lvl(); confete(120); vibra([50, 30, 50]);
    const t = document.createElement('div'); t.className = 'toast conq';
    t.textContent = '🏅 Conquista: ' + c.e + ' ' + c.n;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2900);
    ganharXP(25, 'conquista');
  }, 600 + i * 2000));
}

/* ---------- Narrador (lê em voz alta) ---------- */
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let vozPt = null;
function pegaVoz() { try { const vs = speechSynthesis.getVoices(); vozPt = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null; } catch (e) {} }
if (TTS) { pegaVoz(); try { speechSynthesis.onvoiceschanged = pegaVoz; } catch (e) {} }
function paraFala(html) {
  const el = document.createElement('div'); el.innerHTML = html;
  el.querySelectorAll('li,td,th,br,div,h4').forEach(x => x.after(document.createTextNode('. ')));
  return el.textContent
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu, ' ')
    .replace(/→/g, ', ').replace(/×/g, ' vezes ').replace(/÷/g, ' dividido por ').replace(/[–—]/g, ', ')
    .replace(/°C/g, ' graus Celsius').replace(/(\s*\.\s*){2,}/g, '. ').replace(/\s+/g, ' ').trim();
}
let falaBtn = null;
function resetaBtn() { if (falaBtn) { falaBtn.classList.remove('on'); falaBtn.textContent = '🔊 Ouvir'; falaBtn = null; } }
function calar() { if (TTS) try { speechSynthesis.cancel(); } catch (e) {} resetaBtn(); }
function falar(html, btn) {
  if (!TTS) return toast('Seu navegador não tem narração 😕');
  calar();
  try {
    const u = new SpeechSynthesisUtterance(paraFala(html));
    u.lang = 'pt-BR'; if (vozPt) u.voice = vozPt; u.rate = 1.05; u.pitch = 1.05;
    if (btn) { falaBtn = btn; btn.classList.add('on'); btn.textContent = '⏹ Parar'; u.onend = u.onerror = () => { if (falaBtn === btn) resetaBtn(); }; }
    speechSynthesis.speak(u);
  } catch (e) { resetaBtn(); }
}
function botaoOuvir(btn, texto) {
  if (!btn) return;
  btn.onclick = e => { e.stopPropagation(); if (btn.classList.contains('on')) calar(); else falar(typeof texto === 'function' ? texto() : texto, btn); };
}

/* ---------- DECK DE CARDS + QUIZ ---------- */
const ELOGIOS = ['MANDOU BEM! 🔥','GÊNIO! 🧠','É ISSO AÍ! 🚀','ACERTOU EM CHEIO! 🎯','BRABO DEMAIS! 😎','INCRÍVEL! ⭐','PERFEITO! 💯','NINGUÉM SEGURA! ⚡'];
const ERROS = ['Quase! Tenta de novo 💪','Errou, mas faz parte! 🤔','Ops! Olha de novo… 👀','Não foi dessa vez! Bora! 🎮','Hmm… essa não! Pensa mais um pouco 🧐'];
const ERROS_FINAL = ['Errou essa! Mas agora você sabe 👇','Não foi dessa vez! Olha a certa 👇','Ops! Guarda essa pra prova 👇'];
const sorteia = a => a[Math.floor(Math.random() * a.length)];
const embaralha = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const SEG = 20;                       // segundos por pergunta no Relâmpago
let D = null, TIMER = null;           // fase em andamento e cronômetro
const pararTimer = () => { if (TIMER) { clearTimeout(TIMER); TIMER = null; } };
const umaChance = () => D && (D.modo === 'simulado' || D.modo === 'relampago');

function preparaQuiz(q, cor, rot) {
  return {tipo:'quiz', q, cor, rot, ordem: embaralha(q.o.map((_, i) => i)), erros: 0, ok: false};
}
function jogar(m, t) {
  const itens = t.cards.map((c, i) => ({tipo:'card', c, cor: m.cor, key: t.id + ':' + i}))
    .concat(embaralha(t.quiz).map(q => preparaQuiz(q, m.cor, m.em + ' ' + m.nome)));
  iniciar({modo:'fase', itens, cor: m.cor, titulo: t.titulo, m, t});
}
function relampago() {
  const todas = Object.values(QIDX).map(x => preparaQuiz(x.q, x.m.cor, x.m.em + ' ' + x.m.nome));
  iniciar({modo:'relampago', itens: embaralha(todas).slice(0, 10), cor: '#00e5ff', titulo: 'Desafio Relâmpago'});
}
function simulado(m) {
  const pool = [];
  m.topicos.forEach(t => t.quiz.forEach(q => pool.push(preparaQuiz(q, m.cor, t.em + ' ' + t.titulo))));
  iniciar({modo:'simulado', itens: embaralha(pool).slice(0, 10), cor: m.cor, titulo: 'Simulado AV2 • ' + m.nome, m});
}
function revisarErros() {
  const ids = embaralha(Object.keys(P().wrong).filter(id => QIDX[id])).slice(0, 10);
  if (!ids.length) { toast('Nenhum erro pra revisar! 😎'); return; }
  iniciar({modo:'erros', itens: ids.map(id => preparaQuiz(QIDX[id].q, QIDX[id].m.cor, QIDX[id].m.em + ' ' + QIDX[id].t.titulo)), cor: '#ff2d95', titulo: 'Caderno de erros'});
}
function iniciar(cfg) {
  pararTimer();
  D = Object.assign(cfg, {i: 0, xp: 0, primeira: 0, nQuiz: cfg.itens.filter(x => x.tipo === 'quiz').length, combo: 0, maxCombo: 0, trava: false, errados: []});
  tela('<div class="deckhead"><button class="back" id="bk">✕</button><div class="dots" id="dots">' +
    D.itens.map(x => '<i class="' + (x.tipo === 'quiz' ? 'q' : '') + '"></i>').join('') + '</div></div>' +
    '<div class="stage" id="stage"></div>', true);
  $('#navbar').style.setProperty('--c', D.cor);
  $('#bk').onclick = sair;
  ligaSwipe($('#stage'));
  desenha(1);
}
function sair() {
  calar(); pararTimer(); SFX.swipe();
  const id = D && D.m ? D.m.id : null; D = null;
  if (id) materia(id); else home();
}
function textoItem(it) {
  if (it.tipo === 'card') return it.c.k + '. ' + it.c.t + '. ' + it.c.h + ' ' + (it.c.b || '') + ' ' + (it.c.d ? 'Dica: ' + it.c.d : '');
  return it.q.q + it.ordem.map((oi, k) => '. Opção ' + 'ABCD'[k] + ': ' + it.q.o[oi]).join('');
}

function desenha(dir) {
  const it = D.itens[D.i], st = $('#stage');
  pararTimer(); calar();
  st.style.setProperty('--c', it.cor);
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k <= D.i));
  let h;
  if (it.tipo === 'card') {
    const c = it.c;
    h = '<div class="kick">' + c.k + '</div><div class="emo">' + c.e + '</div><h2>' + c.t + '</h2>' +
      '<div class="tx">' + c.h + '</div>' + (c.b ? '<div class="box">' + c.b + '</div>' : '') +
      (c.d ? '<div class="box dica">💡 ' + c.d + '</div>' : '');
    if (D.modo === 'fase' && !P().seen[it.key]) { P().seen[it.key] = 1; D.xp += 5; ganharXP(5, 'card novo'); }
  } else {
    const q = it.q, valor = D.modo === 'simulado' ? 15 : 20;
    const selo = {fase:'🎯 QUIZ', relampago:'⚡ RELÂMPAGO', simulado:'📝 SIMULADO', erros:'🧠 REVISÃO'}[D.modo];
    h = '<span class="qbadge">' + selo + ' • VALE ' + valor + ' XP</span>' +
      (D.modo !== 'fase' ? '<div class="kick" style="margin-top:10px">' + it.rot + '</div>' : '') +
      (D.modo === 'relampago' && !it.ok ? '<div class="timer"><i style="animation-duration:' + SEG + 's"></i></div>' : '') +
      '<div class="qtx">' + q.q + '</div><div class="opts' + (it.ok ? ' lock' : '') + '" id="opts">' +
      it.ordem.map((oi, k) => {
        const cls = !it.ok ? '' : oi === q.a ? ' right' : it.escolha === oi ? ' wrong' : ' dim';
        return '<button class="opt' + cls + '" data-oi="' + oi + '"><span class="L">' + 'ABCD'[k] + '</span><span>' + q.o[oi] + '</span></button>';
      }).join('') + '</div><div id="fb">' + (it.ok ? (it.fb || '') : '') + '</div>';
  }
  st.innerHTML = '<article class="slide ' + (dir > 0 ? 'anim-in-right' : 'anim-in-left') + '">' +
    (TTS ? '<button class="ouvir" id="ouvir">🔊 Ouvir</button>' : '') + h +
    '<span class="pg">' + (D.i + 1) + ' / ' + D.itens.length + '</span></article>';
  if (it.tipo === 'quiz' && !it.ok) {
    st.querySelectorAll('.opt').forEach(b => b.onclick = () => responder(b, it));
    if (D.modo === 'relampago') { it.t0 = Date.now(); TIMER = setTimeout(() => esgotou(it), SEG * 1000); }
  }
  if (TTS) {
    const ob = $('#ouvir'); botaoOuvir(ob, () => textoItem(it));
    if (DB.narrador) setTimeout(() => { if (D && D.itens[D.i] === it) falar(textoItem(it), ob); }, 450);
  }
  botoes();
}
function botoes() {
  const it = D.itens[D.i], nx = $('#btnNext');
  $('#btnPrev').disabled = D.i === 0 || D.modo === 'relampago';
  const bloqueado = it.tipo === 'quiz' && !it.ok;
  nx.disabled = bloqueado;
  nx.textContent = bloqueado ? '🔒 RESPONDA PRA AVANÇAR' : D.i === D.itens.length - 1 ? 'FINALIZAR 🏁' : 'AVANÇAR ▶';
  nx.classList.toggle('pulse', it.tipo === 'quiz' && it.ok);
}
function tremeSlide() {
  const sl = $('#stage .slide'); if (!sl) return;
  sl.classList.remove('flash-bad'); void sl.offsetWidth; sl.classList.add('flash-bad');
}
function revelaCerta(it) {
  const o = $('#opts'); o.classList.add('lock');
  o.querySelectorAll('.opt').forEach(b => { const v = +b.dataset.oi; if (v === it.q.a) b.classList.add('right'); else if (v !== it.escolha) b.classList.add('dim'); });
}
function registraErro(it) {
  const p = P();
  it.erros++; D.combo = 0; p.combo = 0; p.erros++;
  p.wrong[it.q.id] = (p.wrong[it.q.id] || 0) + 1;
  if (!D.errados.includes(it)) D.errados.push(it);
  salvar(); hud();
}
function responder(b, it) {
  if (it.ok) return;
  const q = it.q, oi = +b.dataset.oi, p = P(), fb = $('#fb');
  if (oi === q.a) {
    pararTimer(); calar();
    it.ok = true;
    b.classList.add('right'); $('#opts').classList.add('lock');
    $('#opts').querySelectorAll('.opt').forEach(o => { if (o !== b) o.classList.add('dim'); });
    const primeira = it.erros === 0;
    let ganho = D.modo === 'simulado' ? 15 : primeira ? 20 : it.erros === 1 ? 10 : 5, extra = '';
    if (primeira) {
      D.primeira++; D.combo++; p.combo++;
      D.maxCombo = Math.max(D.maxCombo, D.combo); p.maxCombo = Math.max(p.maxCombo, p.combo);
      if (p.wrong[q.id]) { delete p.wrong[q.id]; p.dominadas++; extra += ' <b style="color:var(--cyan)">🧠 ERRO SUPERADO!</b>'; }
      if (D.combo >= 3) { ganho += 5; extra += ' <b style="color:#ff8a3d">🔥 COMBO x' + D.combo + '</b>'; }
    }
    if (D.modo === 'relampago' && Date.now() - it.t0 < 6000) { ganho += 5; extra += ' <b style="color:var(--gold)">⚡ RAPIDINHO!</b>'; }
    p.acertos++;
    it.fb = '<div class="fb ok"><b>✅ ' + sorteia(ELOGIOS) + '</b>' + extra + '<br>' + q.x + '</div>';
    fb.innerHTML = it.fb;
    SFX.ok(); confete(primeira ? 70 : 30); vibra(40);
    D.xp += ganho; ganharXP(ganho, primeira ? 'de primeira!' : 'acertou');
  } else {
    registraErro(it);
    b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); b.disabled = true;
    tremeSlide(); SFX.no(); vibra([120, 60, 120]);
    if (umaChance()) {
      pararTimer(); it.ok = true; it.escolha = oi; revelaCerta(it);
      it.fb = '<div class="fb no"><b>❌ ' + sorteia(ERROS_FINAL) + '</b><br>Resposta certa: <b>' + q.o[q.a] + '</b>. ' + q.x + '</div>';
      fb.innerHTML = it.fb;
    } else {
      fb.innerHTML = '<div class="fb no"><b>❌ ' + sorteia(ERROS) + '</b><br>Ainda dá pra ganhar XP. Escolha outra opção!</div>';
    }
  }
  botoes();
}
function esgotou(it) {
  TIMER = null;
  if (!D || D.itens[D.i] !== it || it.ok) return;
  registraErro(it); it.ok = true; it.escolha = -1; revelaCerta(it);
  it.fb = '<div class="fb no"><b>⏰ O TEMPO ACABOU!</b><br>Resposta certa: <b>' + it.q.o[it.q.a] + '</b>. ' + it.q.x + '</div>';
  $('#fb').innerHTML = it.fb; tremeSlide(); SFX.no(); vibra([200]);
  botoes();
}
function mover(delta) {
  if (!D || D.trava) return;
  const it = D.itens[D.i];
  if (delta > 0 && it.tipo === 'quiz' && !it.ok) {
    const o = $('#opts'); if (o) { o.style.animation = 'none'; void o.offsetWidth; o.style.animation = 'shake .4s'; }
    vibra(60); return;
  }
  if (delta < 0 && (D.i === 0 || D.modo === 'relampago')) return;
  if (delta > 0 && D.i === D.itens.length - 1) return resultado();
  D.trava = true; SFX.swipe(); calar(); pararTimer();
  const s = $('#stage .slide');
  if (s) s.className = 'slide ' + (delta > 0 ? 'anim-out-left' : 'anim-out-right');
  setTimeout(() => { if (!D) return; D.i += delta; D.trava = false; desenha(delta); }, 280);
}
$('#btnNext').onclick = () => mover(1);
$('#btnPrev').onclick = () => mover(-1);
function ligaSwipe(el) {
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) mover(dx < 0 ? 1 : -1);
  });
}
document.addEventListener('keydown', e => {
  if (!D || document.querySelector('.ov')) return;
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); mover(1); }
  else if (e.key === 'ArrowLeft') mover(-1);
  else {
    const k = '1234abcd'.indexOf(e.key.toLowerCase());
    if (k >= 0) { const b = document.querySelectorAll('#opts .opt')[k % 4]; if (b && !b.disabled) b.click(); }
  }
});

/* ---------- RESULTADOS ---------- */
const revisao = lista => !lista.length ? '' :
  '<div class="rev"><div class="sec-t" style="margin-top:0">📌 Pra revisar (já foram pro caderno de erros)</div>' +
  lista.map(it => '<div class="ri">' + it.q.q + '<br><b class="ok">✔ ' + it.q.o[it.q.a] + '</b><br><small>' + it.q.x + '</small></div>').join('') + '</div>';

function resultado() {
  calar(); pararTimer();
  const p = P(), ctx = D;
  if (ctx.modo === 'simulado') return resultadoSimulado(ctx);
  const r = ctx.nQuiz ? ctx.primeira / ctx.nQuiz : 1, stars = r >= .9 ? 3 : r >= .6 ? 2 : 1;
  let bonus = 0;
  if (ctx.modo === 'fase') {
    const antes = p.done[ctx.t.id];
    if (!antes) bonus += 30;
    if (stars === 3 && (!antes || antes.stars < 3)) bonus += 50;
    p.done[ctx.t.id] = {stars: Math.max(stars, antes ? antes.stars : 0), best: Math.max(ctx.primeira, antes ? antes.best : 0)};
  } else if (ctx.modo === 'relampago') {
    if (ctx.primeira > p.relBest) { p.relBest = ctx.primeira; if (ctx.primeira >= 5) bonus += 20; }
    if (stars === 3) bonus += 40;
  } else if (ctx.modo === 'erros') bonus += 5 * ctx.primeira;
  salvar();
  const titulo = {fase:'FASE CONCLUÍDA!', relampago:'DESAFIO CONCLUÍDO!', erros:'REVISÃO CONCLUÍDA!'}[ctx.modo];
  const frase = stars === 3 ? 'LENDÁRIO! Você é fera! 🏆' : stars === 2 ? 'Muito bom! Falta pouco pra perfeição! 💪' : 'Boa! Joga de novo pra pegar 3 estrelas! 🎮';
  tela('<div class="result" style="--c:' + ctx.cor + '"><div class="trophy">' + (stars === 3 ? '🏆' : stars === 2 ? '🥈' : '🎖️') + '</div>' +
    '<h1 class="orb" style="font-size:26px">' + titulo + '</h1><p style="color:var(--mut)">' + esc(ctx.titulo) + '</p>' +
    '<div class="st">' + [0, 1, 2].map(k => '<span style="animation-delay:' + (.3 + k * .25) + 's">' + (k < stars ? '⭐' : '☆') + '</span>').join('') + '</div>' +
    '<p style="font-weight:900;font-size:18px">' + frase + '</p>' +
    '<div class="kpis"><div class="kpi"><b>' + ctx.primeira + '/' + ctx.nQuiz + '</b><small>' + (ctx.modo === 'relampago' ? 'acertos' : 'de primeira') + '</small></div>' +
    '<div class="kpi"><b>+' + (ctx.xp + bonus) + '</b><small>XP aqui</small></div>' +
    '<div class="kpi"><b>x' + ctx.maxCombo + '</b><small>combo máx.</small></div></div>' +
    (bonus ? '<p style="color:var(--gold);font-weight:900">🎁 Bônus: +' + bonus + ' XP</p>' : '') +
    (ctx.modo === 'relampago' ? '<p style="color:var(--mut)">Seu recorde: <b style="color:var(--cyan)">' + p.relBest + '/10</b></p>' : '') +
    '<button class="btn go" id="rep" style="width:100%;margin-top:14px">🔁 JOGAR DE NOVO</button>' +
    (ctx.modo === 'fase' && GABARITO[ctx.m.id] ? '<button class="btn" id="gab" style="width:100%;margin-top:10px">🔓 Ver gabarito do livro</button>' : '') +
    (ctx.m ? '<button class="btn" id="vol" style="width:100%;margin-top:10px">◀ Voltar para ' + esc(ctx.m.nome) + '</button>' : '') +
    '<button class="btn" id="men" style="width:100%;margin-top:10px">🏠 Menu</button>' + revisao(ctx.errados) + '</div>', false);
  D = null;
  SFX.win(); confete(stars === 3 ? 260 : 140);
  if (bonus) setTimeout(() => ganharXP(bonus, 'bônus'), 900); else checaConquistas();
  $('#rep').onclick = () => ctx.modo === 'relampago' ? relampago() : ctx.modo === 'erros' ? revisarErros() : jogar(ctx.m, ctx.t);
  if ($('#gab')) $('#gab').onclick = () => gabarito(ctx.m.id);
  if ($('#vol')) $('#vol').onclick = () => materia(ctx.m.id);
  $('#men').onclick = () => home();
}
function resultadoSimulado(ctx) {
  const p = P(), nota = Math.round(ctx.primeira / ctx.nQuiz * 100) / 10, antes = p.simu[ctx.m.id];
  p.simu[ctx.m.id] = Math.max(nota, antes === undefined ? 0 : antes);
  let bonus = 0;
  if (nota >= 7 && (antes === undefined || antes < 7)) bonus += 30;
  if (nota >= 10 && (antes === undefined || antes < 10)) bonus += 100;
  salvar();
  const msg = nota >= 9 ? '🏆 Nota de gênio! A AV2 que se prepare!' : nota >= 7 ? '✅ Aprovado! Acima da média 7!' : '📚 Abaixo da média 7. Revise os erros e tente de novo!';
  tela('<div class="result" style="--c:' + ctx.cor + '"><div class="trophy">' + (nota >= 9 ? '🏆' : nota >= 7 ? '✅' : '📚') + '</div>' +
    '<h1 class="orb" style="font-size:24px">SIMULADO CONCLUÍDO</h1><p style="color:var(--mut)">' + esc(ctx.m.nome) + ' • prova em ' + ctx.m.data + '</p>' +
    '<div class="nota">' + String(nota).replace('.', ',') + '<small>/10</small></div>' +
    '<p style="font-weight:900;font-size:18px">' + msg + '</p>' +
    '<div class="kpis"><div class="kpi"><b>' + ctx.primeira + '</b><small>acertos</small></div>' +
    '<div class="kpi"><b>' + (ctx.nQuiz - ctx.primeira) + '</b><small>erros</small></div>' +
    '<div class="kpi"><b>' + String(p.simu[ctx.m.id]).replace('.', ',') + '</b><small>melhor nota</small></div></div>' +
    (bonus ? '<p style="color:var(--gold);font-weight:900">🎁 Bônus: +' + bonus + ' XP</p>' : '') +
    '<button class="btn go" id="rep" style="width:100%;margin-top:14px">🔁 NOVO SIMULADO</button>' +
    '<div class="btnrow"><button class="btn" id="res">📄 Resumão</button><button class="btn" id="err">🧠 Meus erros</button></div>' +
    '<button class="btn" id="vol" style="width:100%">◀ Voltar para ' + esc(ctx.m.nome) + '</button>' + revisao(ctx.errados) + '</div>', false);
  D = null;
  SFX.win(); confete(nota >= 7 ? 240 : 80);
  if (bonus) setTimeout(() => ganharXP(bonus, 'bônus do simulado'), 900); else checaConquistas();
  $('#rep').onclick = () => simulado(ctx.m);
  $('#res').onclick = () => resumao(ctx.m.id);
  $('#err').onclick = () => revisarErros();
  $('#vol').onclick = () => materia(ctx.m.id);
}

/* ---------- INÍCIO ---------- */
if (DB.current && DB.players[DB.current]) { hud(); home(); setTimeout(checaConquistas, 800); }
else { app.innerHTML = ''; telaPerfil(false); }
</script>
</body>
</html>
