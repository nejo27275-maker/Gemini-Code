<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Estudo Gamer • AV2 Dezembro • 5º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a14; --card:#121a33; --card2:#18213f; --line:#26305a;
  --txt:#e8ecff; --mut:#8e98c8; --cyan:#00e5ff; --pur:#a855f7; --pink:#ff2d95;
  --ok:#22ff88; --bad:#ff3b5c; --gold:#ffd23f; --orange:#ff8a3d; --c:var(--cyan);
  --r:20px; --sh:0 10px 40px rgba(0,0,0,.45);
  --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(60vw 60vw at 10% -10%,rgba(168,85,247,.22),transparent 60%),
             radial-gradient(50vw 50vw at 110% 20%,rgba(0,229,255,.15),transparent 60%),
             radial-gradient(60vw 50vw at 50% 120%,rgba(255,45,149,.13),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:disabled{cursor:default}
.hide{display:none!important}
.orb{font-family:Orbitron,Nunito,sans-serif;letter-spacing:.04em}
.mut{color:var(--mut)}

/* ===== barra do topo ===== */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:calc(8px + var(--safeT)) 14px 8px;background:rgba(7,10,20,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left}
.me .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;
  background:linear-gradient(135deg,var(--pur),var(--cyan));box-shadow:0 0 16px rgba(0,229,255,.4)}
.me .lvl{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;max-width:130px}
.me .lvl b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .lvl i{display:block;height:7px;border-radius:7px;background:#1b2347;overflow:hidden}
.me .lvl s{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pur),var(--pink));transition:width .8s cubic-bezier(.2,.9,.2,1);text-decoration:none}
.stats{display:flex;gap:6px}
.st{display:flex;align-items:center;gap:4px;padding:6px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:900;font-size:14px;white-space:nowrap}
.st.fire{color:var(--orange)} .st.gem{color:var(--cyan)} .st.heart{color:var(--bad)}
.st.off{filter:grayscale(1);opacity:.6}
.st.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}

/* ===== abas de baixo ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;
  padding:6px 6px calc(6px + var(--safeB));background:rgba(7,10,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabs .in{display:flex;width:100%;max-width:640px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--mut);font-weight:800;font-size:11px;position:relative}
.tabs button i{font-style:normal;font-size:22px;filter:grayscale(.6);transition:transform .2s}
.tabs button.on{color:var(--txt);background:rgba(0,229,255,.08);box-shadow:inset 0 0 0 1px rgba(0,229,255,.35)}
.tabs button.on i{filter:none;transform:translateY(-2px) scale(1.12)}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}

/* ===== telas ===== */
main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + var(--safeB))}
.view{animation:viewIn .4s cubic-bezier(.2,.9,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sec-t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;margin:22px 4px 10px;font-weight:900}
.card{border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line)}
.hero{border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(168,85,247,.32),rgba(0,229,255,.16));border:1px solid rgba(168,85,247,.5);box-shadow:var(--sh)}
.hero h1{font-size:clamp(20px,5vw,28px);line-height:1.15}
.hero p{color:#cdd3ff;margin-top:6px;font-size:14px}
.hero .big{position:absolute;right:-6px;bottom:-16px;font-size:90px;opacity:.22;transform:rotate(-12deg)}

/* plano do dia + meta */
.plano{border-radius:var(--r);padding:16px;background:linear-gradient(150deg,rgba(0,229,255,.14),rgba(168,85,247,.12) 60%,var(--card));border:1px solid rgba(0,229,255,.45);box-shadow:0 0 30px -12px var(--cyan)}
.plano .ph{display:flex;align-items:center;gap:10px}
.plano .ph .bot{font-size:34px;animation:bob 3s ease-in-out infinite}
.plano .ph b{font-size:16px;display:block}
.plano .ph small{color:var(--mut);font-size:12px}
.plano .fala{margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.25);font-size:14px;line-height:1.45}
.tarefa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:16px;background:rgba(7,10,20,.55);border:1px solid var(--line);transition:.2s}
.tarefa:hover{border-color:var(--c);transform:translateX(3px)}
.tarefa .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--c);color:#06101c;flex:none;box-shadow:0 0 14px -2px var(--c)}
.tarefa .tt{flex:1;min-width:0}
.tarefa .tt b{display:block;font-size:15px}
.tarefa .tt small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.tarefa .go{font-weight:900;color:var(--c);font-size:13px}
.tarefa.feita{opacity:.55}
.tarefa.feita .ti{background:var(--ok)}
.planbtns{display:flex;gap:8px;margin-top:10px}
.planbtns .btn{flex:1;padding:11px 10px;font-size:13px}
.meta{display:flex;align-items:center;gap:10px;margin-top:12px}
.meta .bar{flex:1;height:12px;border-radius:12px;background:#1b2347;overflow:hidden}
.meta .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));box-shadow:0 0 10px var(--gold);transition:width .8s}
.meta b{font-size:13px;white-space:nowrap}

/* seletor de matérias */
.subs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:14px -14px 0;padding-left:14px;padding-right:14px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:9px 10px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:12px;transition:.2s}
.sub i{font-style:normal;font-size:24px}
.sub small{color:var(--mut);font-size:10px;font-weight:800}
.sub.on{border-color:var(--c);box-shadow:0 0 18px -6px var(--c);background:linear-gradient(160deg,var(--card2),var(--card))}
.sub.on small{color:var(--c)}
.exam{background:rgba(18,26,51,.92);display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;margin-top:4px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,transparent),rgba(18,26,51,.92));border:1px solid var(--c)}
.exam .ee{font-size:40px;filter:drop-shadow(0 0 10px var(--c))}
.exam .ei{flex:1;min-width:0}
.exam .ei b{display:block;font-size:18px}
.exam .ei small{display:block;color:#cdd3ff;font-size:12px;margin-top:2px}
.exam .pb{height:8px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:8px}
.exam .pb i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.exam .eb{display:flex;flex-direction:column;gap:6px}
.exam .eb button{padding:7px 10px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);font-weight:800;font-size:12px;white-space:nowrap}

/* trilha */
.unit{margin:26px 0 8px;padding:14px 16px;border-radius:18px;background:var(--c);color:#06101c;display:flex;align-items:center;gap:12px;box-shadow:0 8px 26px -10px var(--c)}
.unit .ut{flex:1;min-width:0}
.unit .ut small{display:block;font-weight:900;font-size:11px;letter-spacing:.12em;opacity:.75}
.unit .ut b{display:block;font-size:17px;line-height:1.2}
.unit .ut span{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:2px}
.unit .ug{padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.18);font-weight:900;font-size:12px;color:#06101c;white-space:nowrap}
.forca{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:900}
.forca i{flex:1;max-width:120px;height:6px;border-radius:6px;background:rgba(0,0,0,.22);overflow:hidden}
.forca i s{display:block;height:100%;background:#06101c;text-decoration:none}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0 6px}
.nodew{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:74px;border-radius:24px;transform:rotate(45deg);display:grid;place-items:center;position:relative;
  background:#1b2347;border:2px solid #2e3a6e;box-shadow:0 6px 0 #0d1330;transition:transform .15s}
.node>span{transform:rotate(-45deg);font-size:30px;filter:grayscale(1) opacity(.45)}
.node.open{background:var(--c);border-color:#fff3;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 30px -4px var(--c)}
.node.open>span{filter:none}
.node.cur{animation:pulseNode 1.6s infinite}
@keyframes pulseNode{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 0 10px color-mix(in srgb,var(--c) 22%,transparent),0 0 40px var(--c)}}
.node.done{background:linear-gradient(135deg,var(--gold),var(--orange));border-color:#fff5;box-shadow:0 6px 0 #8a5a00,0 0 22px -6px var(--gold)}
.node.done>span{filter:none}
.node:active{transform:rotate(45deg) translateY(4px);box-shadow:0 2px 0 #0d1330}
.node.big{width:92px;height:92px;border-radius:30px}
.node.big>span{font-size:38px}
.nlabel{margin-top:12px;font-size:12px;font-weight:800;color:var(--mut);max-width:150px;text-align:center}
.bubble{position:absolute;top:-38px;padding:6px 12px;border-radius:12px;background:#fff;color:#0b1026;font-weight:900;font-size:12px;white-space:nowrap;animation:bob 2s ease-in-out infinite;z-index:3;letter-spacing:.06em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.crown{position:absolute;top:-10px;right:-14px;font-size:18px;z-index:2}
.pop{position:relative;width:min(320px,92vw);margin-top:14px;padding:14px;border-radius:18px;background:var(--card2);border:1px solid var(--c);box-shadow:0 14px 40px -10px var(--c);animation:viewIn .25s;z-index:4;text-align:left}
.pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--ax,0px));margin-left:-8px;width:16px;height:16px;background:var(--card2);border-left:1px solid var(--c);border-top:1px solid var(--c);transform:rotate(45deg)}
.pop b{display:block;font-size:16px}
.pop small{display:block;color:var(--mut);margin:3px 0 10px;font-size:13px;line-height:1.4}
.mascote{font-size:44px;margin:2px 0;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(0,229,255,.5))}
@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}
/* ===== botões ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 18px;border-radius:16px;font-weight:900;font-size:15px;
  background:var(--card);border:1px solid var(--line);transition:transform .12s,opacity .2s,filter .2s}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--pur)));color:#05080f;border:0;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,#000);font-family:Orbitron,Nunito,sans-serif;letter-spacing:.06em}
.btn.go:active{box-shadow:0 1px 0 color-mix(in srgb,var(--c) 40%,#000);transform:translateY(4px)}
.btn.go:disabled{background:#232c52;color:#68729f;box-shadow:0 5px 0 #121835}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.w{width:100%}
.btn.pulse{animation:pulseBtn 1.3s infinite}
@keyframes pulseBtn{50%{filter:brightness(1.25)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== tela de lição ===== */
.lesson{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg)}
.lesson::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70vw 50vw at 50% -10%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.lbar{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safeT)) 16px 10px;max-width:680px;width:100%;margin:0 auto}
.lbar .x{font-size:22px;color:var(--mut);padding:4px 8px}
.lprog{flex:1;height:16px;border-radius:16px;background:#1b2347;overflow:hidden;position:relative}
.lprog i{display:block;height:100%;width:0;border-radius:16px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff));box-shadow:0 0 14px var(--c);transition:width .5s cubic-bezier(.2,.9,.2,1)}
.lprog i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.lstat{font-weight:900;font-size:15px;white-space:nowrap}
.lstat.heart{color:var(--bad)} .lstat.timer{color:var(--gold);min-width:44px;text-align:right}
.lbody{flex:1;overflow-y:auto;padding:8px 18px 20px;max-width:680px;width:100%;margin:0 auto}
.lfoot{border-top:2px solid var(--line);padding:14px 18px calc(14px + var(--safeB));display:flex;gap:10px;max-width:680px;width:100%;margin:0 auto}
.lfoot .btn.go{flex:1;font-size:16px;padding:16px}
.lfoot .hint{flex:none;width:56px;padding:0;font-size:22px}
.combo{display:inline-block;margin-left:6px;color:var(--orange);font-weight:900;font-size:13px;animation:bump .5s}
.ltitle{font-size:clamp(19px,4.6vw,24px);font-weight:900;line-height:1.25;margin:8px 0 14px}
.lkick{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-top:6px}
.tutor{display:flex;align-items:flex-start;gap:10px;margin:6px 0 16px}
.tutor .tb{font-size:40px;flex:none;animation:bob 3s ease-in-out infinite}
.tutor .fala{position:relative;padding:12px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:16px;font-weight:800;line-height:1.4}
.tutor .fala::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:var(--card2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.ouvir{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:900;font-size:13px}
.ouvir.on{background:var(--c);color:#05080f;border-color:transparent;animation:pulseBtn 1.2s infinite}
.aibox{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,229,255,.07);border:1px dashed rgba(0,229,255,.5);font-size:14.5px;line-height:1.5;white-space:pre-wrap;animation:viewIn .3s}
.aibox b.who{color:var(--cyan)}

/* card de conteúdo dentro da lição */
.lcard{position:relative;border-radius:22px;padding:22px 18px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.lcard::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-90px;background:var(--c);opacity:.12;filter:blur(30px);pointer-events:none}
.lcard .top2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lcard .emo{font-size:54px;margin:10px 0 2px;display:inline-block;animation:bob 3s ease-in-out infinite}
.lcard h2{font-size:clamp(20px,4.6vw,26px);line-height:1.15;margin:6px 0 10px}
.tx{font-size:16.5px;line-height:1.55;color:#d9defc}
.tx b,.tx strong{color:#fff}
.tx em{color:var(--c);font-style:normal;font-weight:800}
.tx ul{list-style:none;margin-top:6px}
.tx li{padding:6px 0 6px 26px;position:relative}
.tx li::before{content:"▸";position:absolute;left:6px;color:var(--c);font-weight:900}
.tx table,.ans table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14.5px}
.tx td,.tx th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tx th{color:var(--c);font-size:12.5px;text-transform:uppercase}
.box{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,229,255,.07);border-left:4px solid var(--c);font-size:15px;line-height:1.5}
.box.dica{background:rgba(255,210,63,.08);border-color:var(--gold)}
.in-r{animation:inR .45s cubic-bezier(.2,.9,.25,1.12) both}
@keyframes inR{from{opacity:0;transform:translateX(70px) scale(.96)}to{opacity:1;transform:none}}
.out-l{animation:outL .25s ease-in both}
@keyframes outL{to{opacity:0;transform:translateX(-80px) scale(.95)}}

/* opções */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:#0f1630;border:2px solid var(--line);
  border-bottom-width:5px;font-size:16px;font-weight:700;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:translateY(2px)}
.opt .L{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:900;flex:none;font-size:13px}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#0f1630)}
.opt.sel .L{background:var(--c);color:#05080f}
.opt.right{border-color:var(--ok);background:rgba(34,255,136,.14);color:#d9ffe9;animation:glow 1s ease-out}
.opt.right .L{background:var(--ok);color:#03140b}
.opt.wrong{border-color:var(--bad);background:rgba(255,59,92,.16);color:#ffd0d8;animation:shake .5s}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.4}
.opt.gone{visibility:hidden}
.lock .opt,.lock .chip,.lock .vf{pointer-events:none}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(34,255,136,.9)}60%{box-shadow:0 0 0 14px rgba(34,255,136,0)}100%{box-shadow:0 0 22px rgba(34,255,136,.3)}}
.vfq{padding:16px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:17px;font-weight:800;line-height:1.45;margin-bottom:14px}
.vfq .res{display:block;margin-top:8px;color:var(--c)}
.vfs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf{padding:22px 10px;border-radius:18px;border:2px solid var(--line);border-bottom-width:6px;background:#0f1630;font-size:18px;font-weight:900}
.vf.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#0f1630)}
.vf.right{border-color:var(--ok);background:rgba(34,255,136,.14)}
.vf.wrong{border-color:var(--bad);background:rgba(255,59,92,.16);animation:shake .5s}
/* lacuna e montar frase */
.frase{font-size:19px;font-weight:800;line-height:1.9;padding:16px;border-radius:18px;background:var(--card2);border:1px solid var(--line);margin-bottom:16px}
.gap{display:inline-block;min-width:90px;padding:0 10px;margin:0 3px;border-bottom:3px solid var(--c);color:var(--c);text-align:center;line-height:1.5}
.gap.right{color:var(--ok);border-color:var(--ok)} .gap.wrong{color:var(--bad);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:11px 15px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:#0f1630;font-size:16px;font-weight:800;transition:transform .1s}
.chip:active{transform:translateY(2px)}
.chip.sel{border-color:var(--c);color:var(--c)}
.chip.used{visibility:hidden}
.monta{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;border-radius:16px;border:2px dashed var(--line);margin-bottom:16px}
.monta.right{border-color:var(--ok);border-style:solid} .monta.wrong{border-color:var(--bad);border-style:solid;animation:shake .5s}
/* ligar pares */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pares .col{display:flex;flex-direction:column;gap:10px}
.pc{min-height:58px;padding:10px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:#0f1630;font-size:14.5px;font-weight:800;line-height:1.25}
.pc.sel{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,#0f1630)}
.pc.ok{border-color:var(--ok);color:var(--ok);opacity:.45;pointer-events:none}
.pc.no{border-color:var(--bad);animation:shake .45s}

/* painel de resultado (acertou/errou) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:18px 18px calc(16px + var(--safeB));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.9,.25,1.05)}
.sheet.show{transform:none}
.sheet .si{max-width:680px;margin:0 auto}
.sheet.ok{background:linear-gradient(180deg,#0c2a1e,#08180f);border-top:3px solid var(--ok)}
.sheet.no{background:linear-gradient(180deg,#2c0e17,#180709);border-top:3px solid var(--bad)}
.sheet h3{font-size:21px;display:flex;align-items:center;gap:8px}
.sheet.ok h3{color:var(--ok)} .sheet.no h3{color:#ff7a90}
.sheet p{margin:6px 0 12px;font-size:15px;line-height:1.45;color:#e7ebff;max-height:30vh;overflow-y:auto}
.sheet .sb{display:flex;gap:10px}
.sheet .sb .btn.go{flex:1}
.sheet.ok .btn.go{--c:var(--ok)} .sheet.no .btn.go{--c:var(--bad)}
.sheet .btn.ai{flex:none;background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.5);color:var(--cyan);font-size:14px}

/* ===== janelas, avisos, confete ===== */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(3,5,12,.84);backdrop-filter:blur(8px);animation:viewIn .3s}
.modal{width:100%;max-width:420px;max-height:92vh;overflow-y:auto;border-radius:24px;padding:24px;background:linear-gradient(160deg,#1a2350,#101633);border:1px solid var(--pur);box-shadow:0 0 60px rgba(168,85,247,.4);text-align:center}
.modal h2{font-size:24px;margin:8px 0}
.modal p{color:#cbd1ff;line-height:1.45}
.modal .big{font-size:84px;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.modal input,.modal select,.chatin textarea{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#0b1026;color:#fff;font:inherit;font-size:16px;font-weight:700;outline:none}
.modal input{margin:16px 0 10px;text-align:center;font-size:17px}
.modal input:focus,.chatin textarea:focus{border-color:var(--cyan)}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px}
.avs button{width:46px;height:46px;border-radius:14px;font-size:24px;background:#0b1026;border:2px solid var(--line)}
.avs button.sel{border-color:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.plist{display:grid;gap:8px;margin:12px 0}
.plist button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#0b1026;border:1px solid var(--line);font-weight:800;text-align:left}
.plist button small{margin-left:auto;color:var(--gold)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.toast{position:fixed;left:50%;top:calc(70px + var(--safeT));z-index:120;transform:translateX(-50%);padding:10px 18px;border-radius:999px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),#ff9d00);color:#1a1000;box-shadow:0 0 30px rgba(255,210,63,.6);animation:toast 1.7s ease forwards;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.conq{top:calc(118px + var(--safeT));background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;animation-duration:2.8s}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:130}

/* ===== fim de lição ===== */
.fim{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 18px calc(24px + var(--safeB));max-width:520px;margin:auto;min-height:100%;justify-content:center}
.fim .big{font-size:96px;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.fim h1{font-size:26px;margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;width:100%}
.kpi{padding:12px 6px;border-radius:16px;background:var(--card);border:2px solid var(--c);text-align:center}
.kpi small{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.kpi b{display:block;font-size:22px;font-family:Orbitron,sans-serif;margin-top:4px}
.nota{font-family:Orbitron,Nunito,sans-serif;font-size:72px;font-weight:800;line-height:1;margin:8px 0 2px;color:var(--c);text-shadow:0 0 30px var(--c);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.nota small{font-size:26px;color:var(--mut);text-shadow:none}
.rev{text-align:left;margin-top:16px;width:100%}
.rev .ri{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);margin-bottom:8px;font-size:14px;line-height:1.45}
.rev .ri b{color:var(--ok)}

/* ===== listas, treino, ranking, perfil ===== */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.modo::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.modo:hover{border-color:var(--c);transform:translateY(-2px)}
.modo .mi{font-size:30px;filter:drop-shadow(0 0 8px var(--c))}
.modo b{font-size:15px}
.modo small{color:var(--mut);font-size:12px;line-height:1.35}
.modo.wide{grid-column:1/-1}
.modo .num{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:3px 9px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.li .le{font-size:26px;flex:none}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:15px}
.li .lt small{display:block;color:var(--mut);font-size:12px}
.li .lr{font-weight:900;color:var(--c);white-space:nowrap;font-size:13px}
.li.me{border-color:var(--cyan);background:linear-gradient(90deg,rgba(0,229,255,.12),var(--card))}
.li .pos{width:30px;text-align:center;font-weight:900;font-size:18px;flex:none}
.zona{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--ok);margin:10px 4px 6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bdg{padding:10px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:11px;color:var(--mut);line-height:1.3}
.bdg i{display:block;font-style:normal;font-size:28px;filter:grayscale(1) opacity(.3)}
.bdg b{display:block;color:var(--mut);font-size:12px;margin:4px 0 2px}
.bdg.on{border-color:var(--gold);background:linear-gradient(160deg,rgba(255,210,63,.12),var(--card))}
.bdg.on i{filter:none} .bdg.on b{color:var(--gold)}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sg i{font-style:normal;font-size:26px}
.sg b{display:block;font-size:18px;font-family:Orbitron,sans-serif}
.sg small{color:var(--mut);font-size:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;margin-top:8px;text-align:left}
.toggle small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.sw{width:48px;height:28px;border-radius:28px;background:#2a3463;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--ok)} .toggle.on .sw::after{left:24px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.seg button{padding:10px 4px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:12px}
.seg button.on{border-color:var(--gold);color:var(--gold)}
.loja{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.loja .le{font-size:30px}
.loja .lt{flex:1}
.loja .lt b{display:block}
.loja .lt small{color:var(--mut);font-size:12px}
.loja .btn{padding:10px 12px;font-size:13px}

/* ===== chat com a IA ===== */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:viewIn .25s}
.msg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-top-left-radius:6px}
.msg.eu{align-self:flex-end;background:linear-gradient(135deg,var(--cyan),var(--pur));color:#05080f;font-weight:700;border-top-right-radius:6px}
.msg.bot .who{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--cyan);margin-bottom:3px}
.msg.think{color:var(--mut);font-style:italic}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;padding:9px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.chatin{position:sticky;bottom:calc(74px + var(--safeB));display:flex;gap:8px;margin-top:12px;padding:10px;border-radius:18px;background:rgba(7,10,20,.92);border:1px solid var(--line);backdrop-filter:blur(10px)}
.chatin textarea{resize:none;height:48px;padding:12px;font-size:15px}
.chatin .btn{flex:none;padding:0 16px}
.iastat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.iastat i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.iastat.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.quizia{margin-top:8px;display:grid;gap:8px}
.quizia button{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#0f1630;font-weight:800;text-align:left;font-size:14px}
.quizia button.right{border-color:var(--ok);background:rgba(34,255,136,.14)}
.quizia button.wrong{border-color:var(--bad);background:rgba(255,59,92,.16);animation:shake .5s}

/* ===== resumão e gabarito ===== */
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;margin-bottom:14px}
.resumo .rt{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:18px;font-weight:900;color:var(--c)}
.resumo .rt span{flex:1}
.resumo .rt small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.resumo .rc{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);margin-bottom:8px;font-size:14px;line-height:1.5}
.resumo .rc h4{font-size:15px;margin-bottom:4px}
.resumo .rc table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.resumo .rc td,.resumo .rc th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.resumo .rc ul{margin:4px 0 0 18px}
.gq{border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.gq summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:800;display:flex;gap:10px;align-items:flex-start}
.gq summary::-webkit-details-marker{display:none}
.gq summary::before{content:"🔒";flex:none}
.gq[open] summary::before{content:"🔓"}
.gq summary small{display:block;color:var(--mut);font-weight:600;margin-top:2px}
.gq .ans{padding:0 16px 16px 44px;color:#d5ffe6;line-height:1.55}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:24px;line-height:1.6}
@media (max-width:420px){.st{padding:5px 7px;font-size:13px}.me .lvl{max-width:90px}.tx{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

</section>

<script>
/* =====================================================================
   CONTEÚDO — AV2 (Dezembro) • 5º Ano • 4º Bimestre
   Card: {e: emoji, k: chamada, t: título, h: texto (HTML), b: caixa, d: dica}
   Quiz: {q: pergunta, o: [opções], a: índice da certa, x: explicação}
   ===================================================================== */
const MATERIAS = [];

MATERIAS.push({
  id:'cie', nome:'Ciências', em:'🔬', cor:'#22ff88', data:'04/12', dia:'sexta', fonte:'livro',
  topicos:[
  {id:'cie1', titulo:'Terra – Planeta “Água”', pg:'pp. 123 a 131', em:'🌍',
   cards:[
    {e:'🌍', k:'Começando', t:'Por que “Planeta Água”?',
     h:'Olhando um globo, dá pra ver: <b>a maior parte da superfície da Terra é coberta por água</b> (cerca de 3/4). Por isso, o nome “Água” também combinaria com o nosso planeta!',
     b:'A água aparece: <b>salgada</b> (oceanos e mares), <b>doce</b> (rios e lagos), nas <b>nuvens</b>, <b>sólida</b> (gelo e neve), <b>subterrânea</b> (lençóis-d’água) e até <b>dentro dos seres vivos</b>.'},
    {e:'🧍', k:'Você é água!', t:'A água no corpo humano',
     h:'<table><tr><th>Parte</th><th>Água</th></tr><tr><td>🫁 Pulmões</td><td><b>90%</b></td></tr><tr><td>🫀 Fígado</td><td>85%</td></tr><tr><td>🩸 Sangue, pele e rins</td><td>80%</td></tr><tr><td>🧠 Cérebro e músculos</td><td>75%</td></tr><tr><td>🧍 Corpo inteiro</td><td><b>70%</b></td></tr><tr><td>🦴 Ossos</td><td>25%</td></tr></table>',
     d:'Campeão: <b>pulmões (90%)</b>. Lanterna: <b>ossos (25%)</b>.'},
    {e:'📊', k:'Pouca pra beber', t:'Quanta água dá pra usar?',
     h:'<ul><li><b>97%</b> é água <b>salgada</b> (mares e oceanos) – não serve para beber.</li><li><b>2%</b> é água <b>congelada</b> (polos e topo das montanhas).</li><li><b>1%</b> é água <b>potável</b> disponível.</li></ul>',
     b:'<b>Potável</b> = água limpa, <em>própria para o consumo</em>.'},
    {e:'🏭', k:'ETA • parte 1', t:'Estação de Tratamento de Água',
     h:'A água de rios, lagos ou represas pode ter sujeira e <b>microrganismos</b>. Por isso ela é tratada:<ul><li><b>1. Captação:</b> é bombeada para a ETA por tubulações de aço.</li><li><b>2. Flocos:</b> recebe <b>cloro, cal e sulfato de alumínio</b> e é agitada – a sujeira se junta em <em>flocos</em>.</li><li><b>3. Decantação e filtração:</b> os flocos pesados vão pro fundo e a água passa por filtros de <b>carvão, areia e cascalho</b>.</li></ul>'},
    {e:'🚰', k:'ETA • parte 2', t:'Até chegar na torneira',
     h:'<ul><li><b>4.</b> Recebe <b>mais cloro</b> (mata microrganismos) e <b>flúor</b> (diminui as <em>cáries</em>).</li><li><b>5.</b> Fica guardada em <b>reservatórios</b>.</li><li><b>6.</b> Vai pelas <b>adutoras</b> (canos grandes) → redes de distribuição → <b>casas</b> (caixa-d’água).</li></ul>',
     d:'Decorar: <b>capta → flocos → filtra → cloro + flúor → reservatório → casa</b>.'},
    {e:'🔬', k:'Cientistas em ação', t:'Água suja no laser',
     h:'Uma gota de água suja na ponta de uma seringa, iluminada por um laser, projeta na parede <b>sujeiras e microrganismos</b>. Conclusão: essa água <b>não deve ser usada</b> sem tratamento (filtrar, ferver, clorar).',
     b:'⚠️ Nunca aponte o laser para os olhos!'},
    {e:'🥛', k:'Propriedades', t:'Água pura é…',
     h:'<ul><li><b>Incolor</b> → sem cor</li><li><b>Inodora</b> → sem cheiro</li><li><b>Insípida</b> → sem sabor</li></ul>',
     d:'Truque: <b>in</b> = sem. In-<b>color</b> (cor), in-<b>odora</b> (odor = cheiro), in-<b>sípida</b> (sabor).'},
    {e:'🔄', k:'Ciclo da água', t:'A água vive se renovando',
     h:'<ul><li><b>1. Evaporação:</b> o Sol aquece rios, lagos e oceanos (e os seres vivos transpiram).</li><li><b>2. Condensação:</b> o vapor esfria e forma as <b>nuvens</b>.</li><li><b>3. Precipitação:</b> nuvens pesadas = <b>chuva</b> (se muito frio: granizo ou neve).</li><li><b>4. Infiltração:</b> a chuva entra no solo (lençóis subterrâneos) ou escoa para rios, lagos e oceanos.</li></ul>',
     b:'O ciclo é essencial para o <b>clima</b>, para as <b>plantas</b> e para <b>abastecer</b> rios, lagos e oceanos.'},
    {e:'🌳', k:'Investigue', t:'Florestas e chuva',

  {id:'cie3', titulo:'Eletricidade e Magnetismo', pg:'pp. 144 a 160', em:'🧲',

  {pg:'p. 130', q:'Minhas descobertas 1. Anote as temperaturas no quadro.', r:'Conforme o experimento. Esperado: a <b>areia</b> fica mais fria na geladeira e mais quente no sol; a <b>água</b> muda menos.'},
  {pg:'p. 130', q:'2. O que aconteceu com a temperatura da água e da areia?', r:'As duas mudaram, mas a <b>areia</b> esquentou e esfriou <b>mais rápido</b>; a <b>água</b> mudou <b>mais devagar</b>.'},
  {pg:'p. 130', q:'3. O que é possível concluir?', r:'A água demora mais para esquentar e esfriar; por isso a grande quantidade de água na Terra <b>equilibra a temperatura</b> do planeta.'},
  {pg:'p. 131', q:'9. Para onde vai a água que você usa em casa?', r:'Vai para o <b>esgoto</b>, pelos encanamentos, até a <b>Estação de Tratamento de Esgoto (ETE)</b>.'},
  {pg:'p. 131', q:'10. Existe ETE em sua cidade?', r:'Resposta pessoal (no livro foi marcado “Sim”).', p:1},
  {pg:'p. 131', q:'11. O tratamento do esgoto favorece a natureza? Justifique.', r:'Resposta pessoal. Ex.: Sim, porque o esgoto é limpo antes de voltar aos rios, protegendo peixes, plantas e pessoas.', p:1},
  {pg:'p. 131', q:'12. Opinião sobre jogar esgoto sem tratamento em rios. Conselho?', r:'É errado: polui a água, mata peixes e espalha doenças. Conselho: ligar a casa à rede de esgoto (ou fazer fossa adequada) e cobrar saneamento das autoridades.'},
  {pg:'p. 134', q:'1. Como aumentar o tempo de disponibilidade dos combustíveis fósseis?', r:'Economizar energia e combustível, usar transporte coletivo, bicicleta, carona e trocar por biocombustíveis e energias limpas (solar, eólica, hidráulica).'},
  {pg:'p. 135', q:'2. Por que o “homem linha” alterou as imagens do muro?', r:'Alternativa <b>c)</b>: ele incentivou o uso de energias <b>renováveis</b> que não agridem o ambiente.'},
  {pg:'p. 137', q:'Disco de Newton 1. Quais cores estão no disco?', r:'Vermelho, laranja, amarelo, verde, azul, anil e violeta.'},
  {pg:'p. 137', q:'2. Ao ser girado, que cor o disco apresenta?', r:'<b>Branca</b> (esbranquiçada).'},
  {pg:'p. 137', q:'3. Por que esse fenômeno acontece?', r:'Girando rápido, nossos olhos misturam as 7 cores, e a mistura delas forma a <b>luz branca</b>.'},
  {pg:'p. 137', q:'4. Já viu a luz branca se decompor em outra situação?', r:'Sim: no <b>arco-íris</b>, num prisma, em bolhas de sabão, num CD ou no jato de uma mangueira no sol.'},
  {pg:'p. 138', q:'3. Em quais atividades usamos a energia solar?', r:'Secar roupas no varal, aquecer a água (aquecedor solar), gerar eletricidade (placas solares), iluminar os ambientes, secar alimentos; as plantas fazem fotossíntese.'},
  {pg:'p. 138', q:'4. Se a luz solar não existisse, o que aconteceria?', r:'O planeta ficaria escuro e muito frio, as plantas não fariam fotossíntese, faltaria alimento, o ciclo da água pararia e não haveria vida.'},
  {pg:'p. 140', q:'Propagação sonora 1. O que aconteceu com os grãos de arroz? Por quê?', r:'Os grãos <b>pularam</b>, porque o som faz o ar e o papel-celofane <b>vibrarem</b>.'},
  {pg:'p. 140', q:'2. Quando o volume aumentou, o que ocorreu?', r:'Os grãos pularam <b>mais forte</b> (a vibração aumentou).'},
  {pg:'p. 140', q:'3. Som alto pode prejudicar a audição? Por quê?', r:'Sim. A vibração forte e rápida pode machucar o tímpano e causar perda de audição.'},
  {pg:'p. 141', q:'5. Quais tipos de energia aparecem na imagem?', r:'Energia do <b>movimento</b> (crianças correndo, bola, carro, carrinho de sorvete), <b>química</b> (alimentos das crianças, combustível do carro), <b>sonora</b> (pássaros cantando, carro), <b>luminosa e térmica</b> (Sol).'},
  {pg:'p. 142', q:'6. Energia produzida a partir da energia elétrica.', r:'a) Ventilador: <b>movimento</b> • b) Abajur: <b>luminosa</b> • c) Chuveiro: <b>térmica</b> • d) Aparelho de som: <b>sonora</b> • e) Computador: <b>luminosa, sonora e térmica</b>.'},
  {pg:'p. 144', q:'Levantando hipóteses 1, 2 e 3.', r:'1. Energia <b>elétrica</b>. 2. Energia <b>magnética</b> (magnetismo). 3. Sim: a corrente elétrica cria campo magnético (eletroímã) e ímãs em movimento geram eletricidade (dínamo).'},
  {pg:'p. 145', q:'1a. Assinale os utensílios que dependem de energia elétrica.', r:'Chuveiro elétrico, computador, micro-ondas, televisão (e lâmpadas).'},
  {pg:'p. 145', q:'1b. Atividades sem e com eletricidade.', r:'<b>Sem:</b> dormir, jogar dominó, lavar louça na pia. <b>Com:</b> tomar banho no chuveiro elétrico, usar o computador, esquentar comida no micro-ondas, assistir TV.'},
  {pg:'p. 147', q:'Eletricidade estática 1. Por que a régua atraiu os papéis?', r:'Porque, ao ser esfregada no cabelo, a régua ficou <b>eletrizada</b> (com cargas elétricas) e atraiu os papéis: é a <b>eletricidade estática</b>.'},
  {pg:'p. 147', q:'2. Já viu esse fenômeno em outra situação?', r:'Ex.: cabelo arrepiado ao pentear, choquinho ao tocar a maçaneta ou outra pessoa, balão que gruda na parede depois de esfregado no cabelo.'},
  {pg:'p. 147', q:'3. O que acontece quando esfregamos uma mão na outra?', r:'As mãos <b>esquentam</b>: o atrito produz calor (energia térmica).'},
  {pg:'p. 148', q:'2. Como o eletricista se protege da corrente elétrica?', r:'Usando equipamentos <b>isolantes</b>: luvas e botas de <b>borracha</b>, capacete e escada/ferramentas com cabo isolante.'},
  {pg:'p. 148', q:'3. O que fazer em cada situação de risco?', r:'🚿 Chuveiro: não mexer nele ligado ou com o corpo molhado; desligar o disjuntor e chamar um eletricista. 🔌 Tomada com benjamim: não ligar vários aparelhos na mesma tomada. ✂️ Criança na tomada: nunca colocar dedos ou objetos de metal; usar protetor de tomada.'},
  {pg:'p. 150', q:'4a. Como é uma lâmpada incandescente por dentro?', r:'Tem um <b>filamento</b> (fio bem fino) preso a fios condutores, dentro de um bulbo de vidro sem ar. A corrente esquenta o filamento, que brilha.'},
  {pg:'p. 150', q:'4b. O que possibilita o funcionamento das lâmpadas?', r:'A <b>corrente elétrica</b> passando por um circuito fechado.'},
  {pg:'p. 150', q:'4c. A terceira lâmpada pode ser acesa? Por quê?', r:'<b>Não</b>, porque está <b>queimada</b> (filamento rompido): o circuito fica aberto e a corrente não passa.'},
  {pg:'p. 151', q:'5a. Por que em A a lâmpada está apagada e em B acesa?', r:'Em A o interruptor está desligado: <b>circuito aberto</b>, a corrente não passa. Em B está ligado: <b>circuito fechado</b>, a corrente chega à lâmpada.'},
  {pg:'p. 151', q:'5b. Função do interruptor, da pilha e dos fios.', r:'<b>Interruptor:</b> abre e fecha o circuito (liga/desliga). <b>Pilha:</b> fonte de energia, fornece a corrente. <b>Fios:</b> conduzem a corrente.'},
  {pg:'p. 153', q:'Lanterna 1. Por que a lâmpada acende quando um fio encosta no outro?', r:'Porque o circuito <b>fecha</b> e a corrente elétrica passa até a lâmpada.'},
  {pg:'p. 153', q:'2. De onde vem a energia elétrica que acende a lâmpada? Por quê?', r:'Das <b>pilhas</b>, que transformam energia química em energia elétrica.'},
  {pg:'p. 153', q:'3. Classifique os materiais em condutores e isolantes.', r:'<b>Condutores:</b> fios (metal por dentro), papel-alumínio, pilhas, soquete/lâmpada. <b>Isolantes:</b> embalagem plástica de detergente, fita adesiva, algodão, capa plástica dos fios.'},
  {pg:'p. 154', q:'6a. Objetivo do horário de verão. Vantagens? Para quem?', r:'Aproveitar mais a luz do dia e <b>economizar energia elétrica</b> (menos lâmpadas acesas no fim da tarde). Vantagem para o país, para o sistema elétrico e para a população.'},
  {pg:'p. 154', q:'6b. Por que só alguns estados participam?', r:'Porque só os estados mais distantes da linha do Equador (Sul, Sudeste e Centro-Oeste) têm dias bem mais longos no verão; perto do Equador os dias têm quase a mesma duração o ano todo.'},
  {pg:'p. 154', q:'6c. Seu estado adota o horário de verão?', r:'Resposta pessoal. Os estados do Nordeste normalmente não adotam, e o horário de verão está suspenso no Brasil desde 2019.', p:1},
  {pg:'p. 155', q:'7. Como Dona Ana pode recolher os alfinetes sem pegar um por um?', r:'Usando um <b>ímã</b>: os alfinetes de metal são atraídos por ele.'},
  {pg:'p. 157', q:'Polos 1, 2 e 3.', r:'1. Polos diferentes se <b>atraíram</b> (grudaram). 2. Polos iguais se <b>repeliram</b> (se afastaram). 3. Mesmo sem encostar, a força age (campo magnético): quanto mais perto, mais forte a atração ou a repulsão.'},
  {pg:'p. 159', q:'8a. Um parafuso será atraído por um ímã se for…', r:'<b>(X) de ferro ou de níquel.</b>'},
  {pg:'p. 159', q:'8b. Ferro e alumínio perto de um ímã:', r:'<b>(X) O pedaço de alumínio não será atraído, pois não sofrerá magnetismo.</b>'},
  {pg:'p. 160', q:'Miniguindaste 1. O que acontece ao aproximar o eletroímã dos clipes? Por quê?', r:'Os clipes de <b>metal</b> são atraídos, porque a corrente da pilha passando pelo fio enrolado transforma o prego em um <b>eletroímã</b>.'},
  {pg:'p. 160', q:'2. Teste outros objetos.', r:'Ex.: clipe de metal – atraído • clipe de plástico – não atraído • prego/tachinha – atraído • borracha, papel, lápis – não atraídos.'}
 ],
 por:[
  {pg:'p. 40', q:'38. Organize: pássaro, também, indígena, privilégio, líder, kayapó.', r:'<b>Proparoxítonas:</b> pássaro, indígena • <b>Paroxítonas:</b> privilégio, líder • <b>Oxítonas:</b> também, kayapó.'},
  {pg:'p. 40', q:'38a. O acento gráfico marca a sílaba pronunciada…', r:'<b>(X) com mais intensidade.</b> (Nessas palavras, o acento agudo também indica som aberto.)'},
  {pg:'p. 40', q:'38b. As paroxítonas foram acentuadas porque terminam com…', r:'<b>(X) ditongo</b> (privilé-gio) e <b>(X) R</b> (líder).'},
  {pg:'p. 40', q:'38c. Outras paroxítonas acentuadas no texto.', r:'Ex.: memória, própria, língua, história (confira no texto).'},
  {pg:'p. 40', q:'“Por que não aparecem proparoxítonas sem acento?”', r:'Porque <b>todas as proparoxítonas são acentuadas</b> na língua portuguesa.'},
  {pg:'p. 49', q:'10a. Por que sabemos que quem diz “Anita” é a professora?', r:'Por causa do <b>travessão</b> que separa a fala e da explicação do narrador: “a professora <b>diz</b> meu nome em voz alta”.'},
  {pg:'p. 49', q:'10b. Que sinal aparece antes do nome no trecho A? Por quê?', r:'O <b>travessão (–)</b>, usado para indicar a <b>fala do personagem</b> (discurso direto).'},
  {pg:'p. 49', q:'10c. A autora só usa esse sinal para a fala direta?', r:'Não. O travessão também separa o <b>comentário do narrador</b> depois da fala, como em “– Achei! <b>– dou um salto</b>.”'},
  {pg:'p. 49', q:'10d. Em qual trecho a narradora coloca a fala dentro do próprio texto?', r:'No <b>trecho B</b>: não há travessão; a narradora conta com as palavras dela o que a professora disse (discurso <b>indireto</b>).'},
  {pg:'p. 49', q:'11. Diferenças entre o trecho B e o A.', r:'No B não há travessão nem exclamação; o verbo está no passado (“dizia”); o nome fica entre vírgulas; quem conta é a narradora (discurso indireto).'},
  {pg:'p. 49', q:'12. Transforme em discurso direto.', r:'Anita olhava para a exposição de sua xará e dizia:<br><b>– Estou encantada!</b>'},
  {pg:'p. 50', q:'13. Qual discurso chama mais a atenção do leitor? Explique.', r:'O <b>discurso direto</b>, porque mostra a fala exata do personagem, com emoção e travessão, como se o leitor estivesse ouvindo.'},
  {pg:'p. 50', q:'14. Copie três trechos com discurso direto.', r:'“– Anita! – a professora diz meu nome em voz alta.” • “– Achei! – dou um salto.” • “– Anita com Anita, e fim de papo.”'},
  {pg:'p. 50', q:'15. Verbos que aparecem antes ou depois da fala.', r:'Ex.: <b>diz, aviso, decreta, dou (um salto)</b>; outros verbos de dizer: falar, gritar, perguntar, responder.'},
  {pg:'p. 50', q:'16. Continue a crônica com um diálogo entre Anita e Mário.', r:'Produção pessoal. Use travessão em cada fala e verbos de dizer. Ex.: – Oi, Mário! – disse Anita. – Vamos andar de skate? – Bora! – respondeu ele.', p:1},
  {pg:'p. 57', q:'27. Responda com versos do texto.', r:'a) Na cabeça: “E o palácio da memória é a cabeça.” • b) “O bebê, quando nasce, chora de alegria.” • c) “A lembrança é muito útil.” (confira os versos no poema da p. 54).'},
  {pg:'p. 57', q:'28. Sentido se trocar “uma” e “a” de lugar.', r:'Ficaria “Cada ano é <b>a</b> paisagem nova…” e “E <b>uma</b> memória é sempre nova”. Muda o sentido: <b>uma</b> (indefinido) fala de algo qualquer; <b>a</b> (definido) fala de algo específico, já conhecido.'},
  {pg:'p. 57', q:'29. Poderia trocar “o” e “a” em “o palácio da memória é a cabeça”?', r:'<b>Não</b>, porque o artigo combina em gênero com o substantivo: <b>o palácio</b> (masculino), <b>a cabeça</b> (feminino).'},
  {pg:'p. 58', q:'30a. “soninho” e “memória” são…', r:'<b>(X) substantivos.</b>'},
  {pg:'p. 58', q:'30b. Quais palavras aparecem antes delas?', r:'<b>o</b> (o soninho) e <b>a</b> (a memória) – são artigos.'},
  {pg:'p. 58', q:'30c. Poderiam aparecer em outra posição mantendo o sentido?', r:'Não. O artigo vem sempre <b>antes</b> do substantivo.'},
  {pg:'p. 58', q:'30d. O autor combinou essas palavras? Explique.', r:'Sim: o artigo concorda com o substantivo em gênero e número – <b>o soninho</b> (masc. sing.), <b>a memória</b> (fem. sing.).'},
  {pg:'p. 58', q:'31. As palavras circuladas (A lembrança / O tempo)…', r:'Alternativa <b>b)</b>: na primeira são femininas e no singular; na segunda, masculinas e no singular.'},
  {pg:'p. 58', q:'32. “O bebê, quando nasce, chora de alegria.”', r:'a) Feminino: “<b>A bebê</b>, quando nasce, chora de alegria.” • b) Plural: “<b>Os bebês</b>, quando nascem, choram de alegria.”'},
  {pg:'p. 59', q:'33. Complete com artigos.', r:'a) Todo mundo foi bebê <b>um</b> dia: <b>a</b> vovó, <b>o</b> papai, <b>os</b> meus irmãos. • b) Não vejo <b>a</b> hora de começar <b>a</b> festa de aniversário. Minha mãe preparou <b>uns</b> pastéis deliciosos.'},
  {pg:'p. 59', q:'34. Título do poema da p. 54.', r:'“<b>A criança mais velha do mundo</b>”. a) Do <b>mundo</b>. b) “A criança mais velha mundo” – fica sem sentido.'},
  {pg:'p. 59', q:'35. Complete o que falta.', r:'a) Envelhecer é o mesmo que viajar <b>de</b> trem. • b) O bebê, quando nasce, chora <b>de</b> alegria.'},
  {pg:'p. 59', q:'36. Quais palavras foram trocadas?', r:'a) “em” e “de”: “Então, <b>de</b> segundo <b>em</b> segundo, a primeira hora vai embora.” • b) “de” e “no”: “É tão divertido como brincar <b>no</b> escuro e não ter medo <b>de</b> nada.”'}
 ],
 geo:[
  {pg:'pp. 92 a 99', q:'Conceitue qualidade de vida.', r:'É viver bem, com saúde e bem-estar, num ambiente com ar limpo, água tratada, saneamento, boa moradia, trabalho, transporte, alimentação, segurança e lazer.'},
  {pg:'pp. 92 a 99', q:'Por que o espaço físico é tão importante para a qualidade de vida?', r:'Porque é nele que vivemos: se o ambiente tem ar, água e moradia de boa qualidade, as pessoas vivem com mais saúde e bem-estar.'},
  {pg:'pp. 92 a 99', q:'Quem é o responsável pelo meio ambiente?', r:'<b>Todos nós</b>: eu, você, a família, comerciantes, fabricantes, prestadores de serviço e governantes.'},
  {pg:'pp. 98 e 99', q:'Que características indicam bioarquitetura?', r:'Plantas nos telhados e paredes, uso de luz e ventilação naturais, materiais naturais/locais, energia solar e captação da água da chuva.'},
  {pg:'pp. 100 a 105', q:'Relacione o tipo de poluição com a consequência.', r:'(e) Radioativa → mutações nos peixes e câncer • (d) Térmica → reduz o oxigênio e acelera outros poluentes • (b) Química → pode intoxicar os animais • (c) Sedimentar → impede a luz e a fotossíntese • (a) Biológica → transmite doenças.'},
  {pg:'pp. 100 a 105', q:'Que tipo de lixo seco mais contamina os oceanos?', r:'O <b>plástico</b> (garrafas, sacolas, embalagens).'},
  {pg:'pp. 100 a 105', q:'Por que todos somos responsáveis pelo lixo que chega ao mar?', r:'Porque o lixo jogado em qualquer lugar é levado pela chuva aos rios, e os rios desembocam no mar.'},
  {pg:'pp. 100 a 105', q:'Principais causas da maré negra.', r:'Vazamentos nas tubulações submersas durante a extração de petróleo e acidentes com navios petroleiros.'},
  {pg:'pp. 100 a 105', q:'Consequências dos vazamentos de petróleo.', r:'<b>Peixes:</b> morrem por asfixia (falta de luz e oxigênio). <b>Aves e mamíferos:</b> morrem de hipotermia ou intoxicados. <b>Praias:</b> ficam sujas e impróprias para a população.'},
  {pg:'pp. 100 a 105', q:'Sua responsabilidade com o lixo e a vida marinha.', r:'Descartar o lixo corretamente, separar recicláveis, usar menos plástico e nunca jogar lixo em rios, praias e mares.'},
  {pg:'pp. 106 a 111', q:'O que determina o art. 225 da Constituição?', r:'Que o <b>Poder Público e a coletividade</b> têm o dever de defender e preservar o meio ambiente para as <b>presentes e futuras gerações</b>.'},
  {pg:'pp. 106 a 111', q:'Camada atmosférica mais importante para a vida.', r:'A <b>troposfera</b>, onde vivemos, respiramos e acontecem chuva, vento e nuvens.'},
  {pg:'pp. 106 a 111', q:'Situações que indicam contaminação do ar.', r:'Fumaça de carros e fábricas, céu acinzentado, pouca visibilidade, cheiro ruim, queimadas e pessoas com problemas respiratórios.'},
  {pg:'pp. 106 a 111', q:'Como diminuir a poluição do ar na cidade?', r:'Andar a pé ou de bicicleta, dar carona, usar transporte coletivo, plantar árvores, não fazer queimadas e instalar filtros nas fábricas.'},
  {pg:'pp. 112 a 119', q:'Qual afirmação define corretamente a erosão?', r:'Alternativa <b>d)</b>: é a ação provocada pelo homem ou pela própria natureza de remover ou deslocar o solo superficial ou profundo.'}
 ],
 mat:[
  {pg:'Temperatura', q:'Que instrumento mede a temperatura?', r:'O <b>termômetro</b>. Unidade mais usada: grau Celsius (°C).'},
  {pg:'Temperatura', q:'Alexandre tinha febre de 38,7 °C e baixou 2,2 °C.', r:'38,7 − 2,2 = <b>36,5 °C</b>.'},
  {pg:'Operações', q:'Distribuidora/piscina/balde: 4.780 L em baldes de 20 L.', r:'4.780 ÷ 20 = <b>239 baldes</b>.'},
  {pg:'Operações', q:'60 copos de 300 mL de suco, de 20 L preparados.', r:'60 × 300 = 18.000 mL = 18 L. Sobraram 20 − 18 = <b>2 L</b>.'},
  {pg:'Tempo', q:'11h10 em minutos e segundos.', r:'11 × 60 + 10 = <b>670 min</b> = 670 × 60 = <b>40.200 s</b>.'},
  {pg:'Tempo', q:'Adiantar 30 minutos é que fração da hora?', r:'<b>1/2</b> hora (meia hora).'},
  {pg:'Tempo', q:'Cílios se renovam a cada 120 dias.', r:'120 dias ≈ <b>4 meses</b> → <b>(X) quadrimestre</b>.'},
  {pg:'Tempo', q:'180 meses de casamento equivalem a…', r:'180 ÷ 12 = <b>15 anos</b>.'},
  {pg:'Tempo', q:'Por que Juan perdeu o voo?', r:'O voo era às <b>8h da manhã</b>, e ele chegou às 19h (uma hora antes das 8 da noite).'},
  {pg:'Tempo', q:'Voo às 10h com duração de 2h45min.', r:'Chegou às <b>12h45</b>.'},
  {pg:'Tempo', q:'500 mil células em 30 segundos.', r:'a) Em 1 s ≈ <b>16.667</b> células. b) Em 1 min = <b>1.000.000</b> de células.'},
  {pg:'Tempo', q:'Dormir 8 h por noite gastando 63 calorias por hora, numa semana.', r:'63 × 8 = 504 por noite; 504 × 7 = <b>3.528 calorias</b>.'},
  {pg:'Medidas', q:'Mesa de 1 m em palmos de 22 cm.', r:'100 ÷ 22 ≈ 4,5 → <b>b) 4 palmos e meio</b>.'},
  {pg:'Combinatório', q:'Duas cores entre branca, creme, azul e verde.', r:'branca-creme, branca-azul, branca-verde, creme-azul, creme-verde, azul-verde → <b>6 combinações</b>.'},
  {pg:'Combinatório', q:'Boneca com 3 chapéus, 4 vestidos e 2 bolsas.', r:'3 × 4 × 2 = <b>24 possibilidades</b>.'},
  {pg:'Combinatório', q:'Cadeado de 3 dígitos com o último 7.', r:'10 × 10 = <b>100 possibilidades</b> para os 2 primeiros dígitos.'},

const cv = $('#confetti'), cx = cv.getContext('2d');
let pecas = [], animando = false;
function confete(qtd = 140) {
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#00e5ff','#a855f7','#ff2d95','#22ff88','#ffd23f','#ff8a3d'];
  for (let i = 0; i < qtd; i++) pecas.push({x: innerWidth / 2 + (Math.random() - .5) * 220, y: innerHeight * .35,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * 7 + 4, c: cores[i % cores.length],
    a: Math.random() * 6, va: (Math.random() - .5) * .4, vida: 140 + Math.random() * 60});

  for (const p of pecas) {
    p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();

      .filter(x => x.pend > 0 || (x.vista && x.f < .5)).sort((a, b) => (b.pend - a.pend) || (a.f - b.f))[0];

/* ---------- Trilha: lições de cada unidade ---------- */
function nodesDe(m) {
  if (m._nodes) return m._nodes;
  const out = [];
  m.topicos.forEach((t, ui) => {
    const n = t.cards.length, partes = n > 7 ? 2 : 1, tam = Math.ceil(n / partes);
    for (let k = 0; k < partes; k++) out.push({id: t.id + ':a' + k, tipo: 'aprender', tid: t.id, mid: m.id, ui, de: k * tam, ate: Math.min(n, (k + 1) * tam), parte: partes > 1 ? k + 1 : 0});
    out.push({id: t.id + ':p', tipo: 'praticar', tid: t.id, mid: m.id, ui});
    out.push({id: t.id + ':d', tipo: 'desafio', tid: t.id, mid: m.id, ui});
    out.push({id: t.id + ':b', tipo: 'bau', tid: t.id, mid: m.id, ui});
  });
  out.push({id: m.id + ':sim', tipo: 'simulado', tid: null, mid: m.id, ui: m.topicos.length});
  return (m._nodes = out);
}

  const t = n.tid ? TOP[n.tid].t : null;

  return curto || !t ? nome : nome + ': ' + t.titulo;

function estadoNo(m, n) {
  const p = P(), ns = nodesDe(m), cur = ns.findIndex(x => !p.nodes[x.id]), i = ns.indexOf(n);

}

function prioridade(id) {
  const m = P().mem[id], r = Math.random() * .35;

}
const porPrioridade = ids => ids.map(id => ({id, s: prioridade(id)})).sort((a, b) => b.s - a.s).map(x => x.id);
const mkMC = (q, mid) => ({t: 'mc', q, id: q.id, mid, ordem: embaralha(q.o.map((_, i) => i))});
function mkVF(q, mid) {
  const verdade = Math.random() < .5, oi = verdade ? q.a : sorteia(q.o.map((_, i) => i).filter(i => i !== q.a));
  const frase = /_{3,}/.test(q.q) ? q.q.replace(/_{3,}/, '<b style="color:var(--c)">' + q.o[oi] + '</b>') : '“' + q.q + '”<span class="res">→ ' + q.o[oi] + '</span>';
  return {t: 'vf', q, id: q.id, mid, verdade, oi, frase};
}
function mkLAC(tid, i, mid) {
  const [f, o, a, x] = EXTRA[tid].l[i];

}
function mkORD(tid, i, mid) {
  const alvo = EXTRA[tid].m[i], pal = alvo.split(' '), tem = new Set(pal.map(w => w.toLowerCase()));
  const m = TOP[tid].m, pool = [];
  m.topicos.forEach(t => (EXTRA[t.id] ? EXTRA[t.id].m : []).forEach(s => s.split(' ').forEach(w => { if (w.length > 1 && !tem.has(w.toLowerCase())) pool.push(w); })));
  const extras = [...new Set(embaralha(pool))].slice(0, 2);
  return {t: 'ord', id: tid + ':m' + i, mid, alvo, chips: embaralha(pal.concat(extras))};
}
function mkPAR(tid, mid) {
  const pares = embaralha(EXTRA[tid].p).slice(0, 4);

}
function itemDeId(id) {
  if (QIDX[id]) return Math.random() < .25 ? mkVF(QIDX[id].q, QIDX[id].m.id) : mkMC(QIDX[id].q, QIDX[id].m.id);
  let r = /^(.+):l(\d+)$/.exec(id); if (r && EXTRA[r[1]] && EXTRA[r[1]].l[+r[2]]) return mkLAC(r[1], +r[2], TOP[r[1]].m.id);
  r = /^(.+):m(\d+)$/.exec(id); if (r && EXTRA[r[1]] && EXTRA[r[1]].m[+r[2]]) return mkORD(r[1], +r[2], TOP[r[1]].m.id);
  return null;
}
const idValido = id => !!(QIDX[id] || /:(l|m)\d+$/.test(id) && itemDeId(id));
function refaz(it) {
  if (it.t === 'mc') return mkMC(it.q, it.mid);

}
function exerciciosUnidade(t, m, rec) {
  const qs = porPrioridade(t.quiz.map(q => q.id)).map(id => QIDX[id].q), usados = new Set(), out = [];
  const pega = () => { const q = qs.find(x => !usados.has(x.id)); if (q) usados.add(q.id); return q; };
  for (let i = 0; i < (rec.mc || 0); i++) { const q = pega(); if (q) out.push(mkMC(q, m.id)); }
  for (let i = 0; i < (rec.vf || 0); i++) { const q = pega(); if (q) out.push(mkVF(q, m.id)); }
  const ex = EXTRA[t.id];
  if (ex) {

    porPrioridade(ex.m.map((_, i) => t.id + ':m' + i)).slice(0, rec.ord || 0).forEach(id => out.push(itemDeId(id)));
  }
  const mix = embaralha(out.filter(Boolean));

async function pedeDica() {

  it.dica = true; L.ajudou = true; $('#lHint').disabled = true;
  const box = $('#ajuda');
  if (iaOn()) {
    box.innerHTML = '<div class="aibox"><b class="who">🤖 Byte:</b> <span id="dicaTxt">pensando…</span></div>';
    try { await iaDica(it, ({text}) => { const e = $('#dicaTxt'); if (e && L && L.fila[0] === it) e.textContent = text; }); }
    catch (e) { const msg = erroIA(e); if (L && L.fila[0] === it) dicaLocal(it, box, msg); }
  } else dicaLocal(it, box);
}
function dicaLocal(it, box, aviso) {
  let tirou = false;
  if (it.t === 'mc' || it.t === 'lac') {
    const certa = it.t === 'mc' ? it.q.a : it.a;
    const cand = $$('#opts [data-v]').filter(b => +b.dataset.v !== certa && !b.classList.contains('sel') && !b.classList.contains('gone'));
    if (cand.length > 1) { sorteia(cand).classList.add('gone'); tirou = true; }
  }
  box.innerHTML = '<div class="aibox">' + (aviso ? '<i class="mut">' + esc(aviso) + '</i>\n' : '') + '<b class="who">💡 Dica:</b> ' + esc(dicaOffline(it)) + (tirou ? '\n✂️ Tirei uma opção errada pra você!' : '') + '</div>';
}

/* ---------- Verificar, painel de resultado e continuar ---------- */
const ELOGIOS = ['Mandou bem!','Gênio!','É isso aí!','Acertou em cheio!','Brabo demais!','Incrível!','Perfeito!','Ninguém segura!'];
const ERROS = ['Quase!','Ops, não foi dessa vez!','Hmm, essa não!','Errou, mas faz parte!'];
const normFrase = s => s.toLowerCase().replace(/[.,!?;:“”"]/g, '').replace(/\s+/g, ' ').trim();
function certaHTML(it) {
  if (it.t === 'mc') return it.q.o[it.q.a];
  if (it.t === 'vf') return (it.verdade ? 'Verdadeiro' : 'Falso') + (it.verdade ? '' : ' – a resposta certa é “' + it.q.o[it.q.a] + '”');
  if (it.t === 'lac') return it.f.replace(/_{3,}/, '<b>' + it.o[it.a] + '</b>');
  if (it.t === 'ord') return esc(it.alvo);
  if (it.t === 'par') return it.pares.map(p => p[0] + ' = ' + p[1]).join(' • ');
  return '';
}
function verificar() {
  if (!L) return;
  if (L.sheet) return continuar();
  const it = L.fila[0], chk = $('#lCheck');
  if (it.t === 'card') {
    if (!P().seen[it.key]) { P().seen[it.key] = 1; L.xp += 2; ganharXP(2, null, true); }
    L.fila.shift(); L.feitos++; SFX.tap(); return proximo();
  }
  if (chk.disabled || it.t === 'par') return;
  let ok = false, resp = '';
  const opts = $('#opts');
  if (it.t === 'mc' || it.t === 'lac') {
    const certa = it.t === 'mc' ? it.q.a : it.a; ok = L.resp === certa; resp = (it.t === 'mc' ? it.q.o : it.o)[L.resp];
    opts.querySelectorAll('[data-v]').forEach(b => { const v = +b.dataset.v; if (v === certa) b.classList.add('right'); else if (v === L.resp) b.classList.add('wrong'); else b.classList.add('dim'); });
    if (it.t === 'lac') $('#gap').classList.add(ok ? 'right' : 'wrong');
  } else if (it.t === 'vf') {
    ok = (L.resp === 1) === it.verdade; resp = L.resp ? 'Verdadeiro' : 'Falso';
    opts.querySelectorAll('[data-v]').forEach(b => { const v = +b.dataset.v === 1; if (v === it.verdade) b.classList.add('right'); else b.classList.add('wrong'); });
  } else if (it.t === 'ord') {
    resp = L.resp.map(k => it.chips[k]).join(' '); ok = normFrase(resp) === normFrase(it.alvo);
    $('#monta').classList.add(ok ? 'right' : 'wrong');
  }
  opts.classList.add('lock'); $('#monta') && $('#monta').classList.add('lock');
  resolve(ok, resp);
}
function resolve(ok, resp, esgotou) {
  pararTimer(); calar();
  const it = L.fila[0], p = P(), primeira = !it.errou, extra = [];
  if (it.t !== 'par') lembra(it.id, ok);
  if (esgotou && it.t === 'mc') $$('#opts [data-v]').forEach(b => b.classList.add(+b.dataset.v === it.q.a ? 'right' : 'dim'));
  let ganho = 0;
  if (ok) {
    if (primeira) { L.primeira++; L.combo++; p.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); p.maxCombo = Math.max(p.maxCombo, p.combo); }
    ganho = L.modo === 'simulado' ? 15 : primeira ? (L.ajudou ? 7 : 10) : 5;
    if (primeira && L.combo >= 3) { ganho += Math.min(10, (L.combo - 2) * 2); extra.push('🔥 combo x' + L.combo); }
    if (L.modo === 'relampago' && Date.now() - L.t0 < 6000) { ganho += 5; extra.push('⚡ rapidinho!'); }
    if (it.id && primeira && p.wrong[it.id]) { delete p.wrong[it.id]; p.dominadas++; extra.push('🧠 erro superado!'); }
    p.acertos++; L.feitos++;
    if ((L.modo === 'treino' || L.modo === 'erros') && vidas() < MAXV) { ganhaVida(1); extra.push('+1 ❤️'); }
    SFX.ok(); vibra(30); if (primeira && L.combo >= 3) confete(40);
  } else {
    it.errou = true; L.erros++; L.combo = 0; p.combo = 0; p.erros++;
    if (it.id) p.wrong[it.id] = (p.wrong[it.id] || 0) + 1;
    if (!L.errados.includes(it)) L.errados.push(it);
    if (L.vidas) perdeVida();
    if (it.t !== 'par' && ['licao', 'treino', 'erros', 'ia'].includes(L.modo)) it.voltar = true; else L.feitos++;
    SFX.no(); vibra([120, 60, 120]);
  }
  if (ganho) { L.xp += ganho; ganharXP(ganho, null, true); }
  salvar(); hud(); statusBar();
  $('#lProg').style.width = (L.feitos / L.total * 100) + '%';
  painel(ok, it, resp, ganho, extra, esgotou);
}
function painel(ok, it, resp, ganho, extra, esgotou) {
  const d = descreveItem(it), sh = $('#sheet');
  sh.className = 'sheet ' + (ok ? 'ok' : 'no');
  sh.innerHTML = '<div class="si"><h3>' + (ok ? '✅ ' + sorteia(ELOGIOS) : esgotou ? '⏰ O tempo acabou!' : '❌ ' + sorteia(ERROS)) +
    (ganho ? ' <span style="color:var(--gold);font-size:15px">+' + ganho + ' XP</span>' : '') + '</h3>' +
    '<p>' + (ok ? '' : '<b>Resposta certa:</b> ' + certaHTML(it) + '<br>') + (d.x || (ok ? 'Continue assim!' : '')) +
    (extra.length ? '<br><b style="color:var(--orange)">' + extra.join(' • ') + '</b>' : '') + (!ok && it.voltar ? '<br><i class="mut">🔁 Essa pergunta volta no fim da lição.</i>' : '') + '</p>' +
    '<div id="porque"></div><div class="sb">' + (!ok ? '<button class="btn ai" id="bPq">' + (iaOn() ? '🤖 Por que errei?' : '📚 Ver no resumo') + '</button>' : '') +
    '<button class="btn go" id="bCont">CONTINUAR</button></div></div>';
  L.sheet = true;
  requestAnimationFrame(() => sh.classList.add('show'));
  $('#bCont').onclick = continuar;
  const bq = $('#bPq');
  if (bq) bq.onclick = async () => {
    bq.disabled = true; SFX.tap();
    const box = $('#porque');
    if (iaOn()) {
      box.innerHTML = '<div class="aibox" style="max-height:26vh;overflow-y:auto"><b class="who">🤖 Byte:</b> <span id="pqTxt">pensando…</span></div>';
      try { await iaPorQue(it, resp, ({text}) => { const e = $('#pqTxt'); if (e) e.textContent = text; }); }
      catch (e) { const msg = erroIA(e); const el = $('#pqTxt'); if (el) el.textContent = (msg ? msg + '\n' : '') + dicaOffline(it); }
    } else box.innerHTML = '<div class="aibox" style="max-height:26vh;overflow-y:auto">' + esc(dicaOffline(it)) + '</div>';
  };
}
function continuar() {
  if (!L) return;
  $('#sheet').classList.remove('show'); L.sheet = false; calar();
  const it = L.fila.shift();
  if (it.voltar) { const novo = refaz(it); novo.errou = true; L.fila.push(novo); }
  if (L.vidas && vidas() <= 0 && L.fila.length) return semVidasDentro();
  proximo();
}
function proximo() {
  if (!L.fila.length) return fimLicao();
  const b = $('#lBody .in-r'); if (b) b.className = 'out-l';
  setTimeout(() => { if (L && !L.sheet) renderItem(); }, 190);
}
function fechaLicao() {
  pararTimer(); calar(); L = null; FIM_ABERTO = false;
  $('#lesson').classList.add('hide'); $('#sheet').className = 'sheet'; $('#lBody').innerHTML = '';
  document.body.style.overflow = '';
}
function sairLicao() {
  if (!L) return;
  if (L.feitos === 0 && !L.sheet) { fechaLicao(); mostraAba(); return; }
  janela('<div class="big">😢</div><h2 class="orb">Sair da lição?</h2><p>Se sair agora, você perde o progresso desta lição.</p>',
    [{t: 'CONTINUAR ESTUDANDO 💪'}, {t: 'Sair', f: () => { fechaLicao(); mostraAba(); rodaFila(); }}]);
}
function semVidasDentro() {
  const p = P(); SFX.heart(); vibra([200, 100, 200]);
  janela('<div class="big">💔</div><h2 class="orb">ACABARAM AS VIDAS!</h2><p>Treine para ganhar vidas (+1 ❤️ por acerto), recarregue com cristais ou espere: volta 1 vida a cada 10 minutos.</p>',
    [...(p.gems >= 30 ? [{t: '💎 RECARREGAR E CONTINUAR (30 💎)', cor: 'var(--cyan)', f: () => { p.gems -= 30; p.hearts = MAXV; p.hTs = Date.now(); salvar(); hud(); SFX.heart(); statusBar(); proximo(); }}] : []),
     {t: '🏋️ Treinar para ganhar vidas', cor: 'var(--ok)', f: () => { fechaLicao(); treinoInteligente(); }},
     {t: 'Sair da lição', f: () => { fechaLicao(); mostraAba(); rodaFila(); }}]);
}

/* ---------- Fim da lição ---------- */
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function listaRevisao(lista) {
  if (!lista.length) return '';
  return '<div class="rev"><div class="sec-t" style="margin-top:4px">📌 Pra revisar (já foi pro caderno de erros)</div>' +
    lista.map(it => { const d = descreveItem(it); return '<div class="ri">' + d.enun + '<br><b>✔ ' + certaHTML(it) + '</b></div>'; }).join('') + '</div>';
}
function telaFim(c, html) {
  FIM_ABERTO = true; L = null; pararTimer();
  $('#lbar').classList.add('hide'); $('#lfoot').classList.add('hide'); $('#sheet').className = 'sheet';
  const body = $('#lBody'); body.innerHTML = '<div class="fim" style="--c:' + c.cor + '">' + html + '</div>'; body.scrollTop = 0;
  $('#fimOk').onclick = () => { fechaLicao(); mostraAba(); rodaFila(); };
}
function fimLicao() {
  const p = P(), c = L, seg = Math.round((Date.now() - c.inicio) / 1000);
  if (c.modo === 'simulado') return fimSimulado(c, seg);
  const prec = c.nEx ? Math.round(c.primeira / c.nEx * 100) : 100, perfeita = c.nEx > 0 && c.erros === 0;
  let bxp = 10, bgem = 0, titulo = 'LIÇÃO CONCLUÍDA!', big = '🎉', nota = '';
  p.licoes++;
  if (perfeita) { bxp += 5; bgem += 5; p.perfeitas++; }
  if (c.modo === 'licao') {
    const ja = p.nodes[c.node.id];
    p.nodes[c.node.id] = {em: ja ? ja.em : Date.now(), perf: !!((ja && ja.perf) || perfeita), prec: Math.max(prec, ja && ja.prec || 0)};
    marcaPlano('licao:' + c.node.id); if (c.tarefa) marcaPlano(c.tarefa);
  } else if (c.modo === 'relampago') {
    titulo = 'DESAFIO CONCLUÍDO!'; big = '⚡';
    if (c.primeira > p.relBest) { p.relBest = c.primeira; bgem += 5; nota = '<p style="color:var(--cyan);font-weight:900">🏅 Novo recorde: ' + c.primeira + '/10!</p>'; }
    else nota = '<p class="mut">Seu recorde: ' + p.relBest + '/10</p>';
  } else if (c.modo === 'erros') { titulo = 'REVISÃO CONCLUÍDA!'; big = '🧠'; marcaPlano('erros'); if (c.tarefa) marcaPlano(c.tarefa); }
  else if (c.modo === 'treino') { titulo = 'TREINO CONCLUÍDO!'; big = '💪'; if (c.tarefa) marcaPlano(c.tarefa); }
  else if (c.modo === 'ia') { titulo = 'LIÇÃO DA IA CONCLUÍDA!'; big = '🤖'; }
  salvar();
  const frase = prec === 100 ? 'PERFEITO! Você é fera! 🏆' : prec >= 80 ? 'Mandou muito bem! 💪' : prec >= 50 ? 'Bom trabalho! Dá uma olhada nos erros 👀' : 'Continue treinando, você vai longe! 🚀';
  SFX.win(); confete(perfeita ? 260 : 150);
  telaFim(c, '<div class="big">' + (perfeita ? '👑' : big) + '</div><h1 class="orb">' + titulo + '</h1><p class="mut">' + esc(c.titulo) + '</p>' +
    '<div class="kpis"><div class="kpi" style="--c:var(--gold)"><small>XP</small><b>+' + (c.xp + bxp) + '</b></div>' +
    '<div class="kpi" style="--c:var(--ok)"><small>Precisão</small><b>' + prec + '%</b></div>' +
    '<div class="kpi" style="--c:var(--cyan)"><small>Tempo</small><b>' + mmss(seg) + '</b></div></div>' +
    '<p style="font-weight:900;font-size:18px">' + frase + '</p>' + nota +
    (perfeita ? '<p style="color:var(--gold);font-weight:900">👑 Sem nenhum erro! +5 💎</p>' : '') +
    (c.maxCombo >= 3 ? '<p style="color:var(--orange);font-weight:900">🔥 Maior combo: x' + c.maxCombo + '</p>' : '') +
    listaRevisao(c.errados) + '<button class="btn go w" id="fimOk" style="margin-top:18px">CONTINUAR</button>');
  ganharXP(bxp, null, true); if (bgem) ganhaGemas(bgem, perfeita ? 'lição perfeita' : 'recorde');
}
function fimSimulado(c, seg) {
  const p = P(), m = c.m, nota = Math.round(c.primeira / c.nEx * 100) / 10, antes = p.simu[m.id];
  p.simu[m.id] = Math.max(nota, antes === undefined ? 0 : antes);
  let bxp = 0, bgem = 0;
  if (nota >= 7 && (antes === undefined || antes < 7)) bxp += 30;
  if (nota >= 10 && (antes === undefined || antes < 10)) { bxp += 50; bgem += 20; }
  if (nota >= 7 && c.node && !p.nodes[c.node.id]) p.nodes[c.node.id] = {em: Date.now(), perf: nota >= 10};
  p.licoes++; marcaPlano('simulado:' + m.id); if (c.tarefa) marcaPlano(c.tarefa); salvar();
  const msg = nota >= 9 ? '🏆 Nota de gênio! A AV2 que se prepare!' : nota >= 7 ? '✅ Aprovado! Acima da média 7!' + (c.node && p.nodes[c.node.id] ? ' Troféu conquistado!' : '') : '📚 Abaixo da média 7. Revise os erros e tente de novo!';
  SFX.win(); confete(nota >= 7 ? 260 : 80);
  telaFim(c, '<div class="big">' + (nota >= 9 ? '🏆' : nota >= 7 ? '✅' : '📚') + '</div><h1 class="orb">SIMULADO CONCLUÍDO</h1><p class="mut">' + esc(m.nome) + ' • prova em ' + m.data + '</p>' +
    '<div class="nota">' + String(nota).replace('.', ',') + '<small>/10</small></div><p style="font-weight:900;font-size:18px">' + msg + '</p>' +
    '<div class="kpis"><div class="kpi" style="--c:var(--ok)"><small>Acertos</small><b>' + c.primeira + '</b></div>' +
    '<div class="kpi" style="--c:var(--bad)"><small>Erros</small><b>' + (c.nEx - c.primeira) + '</b></div>' +
    '<div class="kpi" style="--c:var(--gold)"><small>Melhor</small><b>' + String(p.simu[m.id]).replace('.', ',') + '</b></div></div>' +
    (bxp ? '<p style="color:var(--gold);font-weight:900">🎁 Bônus: +' + bxp + ' XP' + (bgem ? ' e +' + bgem + ' 💎' : '') + '</p>' : '') +
    listaRevisao(c.errados) + '<div class="row2" style="width:100%;margin-top:16px"><button class="btn" id="fimRes">📄 Resumão</button><button class="btn" id="fimDe">🔁 Novo simulado</button></div>' +
    '<button class="btn go w" id="fimOk" style="margin-top:10px">CONTINUAR</button>');
  $('#fimRes').onclick = () => { fechaLicao(); resumao(m.id); rodaFila(); };
  $('#fimDe').onclick = () => { fechaLicao(); simulado(m); };
  if (bxp) ganharXP(bxp, null, true); if (bgem) ganhaGemas(bgem, 'nota 10');
}

/* ---------- Teclado ---------- */
document.addEventListener('keydown', e => {
  if (document.querySelector('.ov')) return;
  if (FIM_ABERTO && e.key === 'Enter') { e.preventDefault(); const b = $('#fimOk'); if (b) b.click(); return; }
  if (!L) return;
  if (e.key === 'Enter') { e.preventDefault(); if (L.sheet) continuar(); else if (!$('#lCheck').disabled) verificar(); return; }
  if (e.key === 'Escape') return sairLicao();
  if (L.sheet) return;
  const k = '1234'.indexOf(e.key);
  if (k >= 0) { const b = $$('#opts [data-v]:not(.gone)')[k]; if (b) b.click(); }
});

/* ---------- Resumão e gabarito ---------- */

  const m = matDe(mid), txtTopico = t => t.titulo + '. ' + t.cards.map(c => c.t + '. ' + c.h + ' ' + (c.b || '') + ' ' + (c.d || '')).join(' ');
  app.innerHTML = '<div class="view"><button class="back" id="bk">◀ Voltar</button>' +
    '<section class="hero" style="background:linear-gradient(135deg,' + m.cor + '44,rgba(18,26,51,.9));border-color:' + m.cor + '"><div class="big">📄</div>' +
    '<h1 class="orb">Resumão • ' + esc(m.nome) + '</h1><p>Tudo o que cai na prova numa página só. Leia na véspera e depois faça o simulado! 🧠</p></section>' +
    '<div class="resumo" style="--c:' + m.cor + '">' + m.topicos.map(t => '<div class="rt" id="r_' + t.id + '"><span>' + t.em + ' ' + esc(t.titulo) + '<small>' + t.pg + '</small></span>' +
      (TTS ? '<button class="ouvir" data-t="' + t.id + '">🔊 Ouvir</button>' : '') + '</div>' +
      t.cards.map(c => '<div class="rc"><h4>' + c.e + ' ' + c.t + '</h4>' + c.h + (c.b ? '<div class="box">' + c.b + '</div>' : '') + (c.d ? '<div class="box dica">💡 ' + c.d + '</div>' : '') + '</div>').join('')).join('') +
    '</div><button class="btn go w" id="irSim" style="margin-top:16px;--c:' + m.cor + '">📝 FAZER O SIMULADO AGORA</button></div>';
  $('#bk').onclick = () => { SFX.tap(); mostraAba(); };
  $('#irSim').onclick = () => { SFX.tap(); simulado(m); };

}
function gabarito(mid) {

/* ---------- ABA TREINAR ---------- */
function abaTreinar() {
  const p = P(), nErr = Object.keys(p.wrong).filter(idValido).length;
  app.innerHTML = '<div class="view"><section class="hero"><div class="big">🏋️</div><h1 class="orb">Treinar</h1><p>Revise do seu jeito. No treino você <b>ganha vidas</b>: +1 ❤️ por acerto!</p></section>' +
    '<div class="modos">' +
    '<button class="modo wide" id="tInt" style="--c:var(--cyan)"><span class="mi">🎯</span><b>Treino inteligente</b><small>O app escolhe as perguntas que você está mais perto de esquecer (repetição espaçada) e dá prioridade às provas mais próximas.</small></button>' +
    '<button class="modo" id="tErr" style="--c:var(--pink)">' + (nErr ? '<span class="num">' + nErr + '</span>' : '') + '<span class="mi">🧠</span><b>Caderno de erros</b><small>' + (nErr ? 'Transforme seus erros em acertos!' : 'Nenhum erro ainda 😎') + '</small></button>' +
    '<button class="modo" id="tRel" style="--c:var(--gold)"><span class="mi">⚡</span><b>Relâmpago</b><small>10 perguntas, 20 s cada. Recorde: ' + p.relBest + '/10</small></button>' +
    '<button class="modo wide" id="tIA" style="--c:var(--pur)"><span class="mi">✨</span><b>Lição criada pela IA</b><small>' +
      (iaOn() ? 'O Byte inventa 5 perguntas novas sobre a unidade que você escolher.' : 'Disponível quando o app é aberto pelo link do claude.ai.') + '</small></button></div>' +
